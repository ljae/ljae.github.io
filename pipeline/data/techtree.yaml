# ─────────────────────────────────────────────────────────────────────
# 에듀트리 테크트리 큐레이션 데이터
#
# 학년 코드: 초1=1 … 초6=6, 중1=7 … 중3=9, 고1=10 … 고3=12
# depth = 그래프 가로축(진행 순서), lane = 세로축(병렬 루트)
#
# ★ 편집 원칙
#   - 엣지는 커뮤니티에서 반복 관찰되는 경로만 등재한다.
#   - evidence_count 는 파이프라인이 자동으로 채운다. 손으로 넣지 않는다.
#   - edge_type: standard(일반) | accelerated(속진) | alternative(우회)
# ─────────────────────────────────────────────────────────────────────

tracks:
  # ══════════════════════ 수학 ══════════════════════
  - id: math_elementary
    subject: math
    school_level: elementary
    title: 초등 수학
    summary: 연산에서 출발해 사고력을 거쳐 경시·심화 또는 중등 선행으로 갈라지는 구간. 4개 학군에서 경쟁이 가장 치열하다.
    sort_order: 0
    stages:
      - id: math_el_basic
        title: 연산 · 교과 기본
        subtitle: 학교 진도 + 연산 숙련
        goal: 학년 교과 개념을 빠짐없이, 연산 정확도 95% 이상
        exit_criteria: 학년 교과 단원평가 안정적 만점, 연산 속도 학년 기준 이상
        grade: [1, 3]
        depth: 0
        lane: 1
      - id: math_el_thinking
        title: 사고력 · 창의수학
        subtitle: 교구 · 퍼즐 · 서술형
        goal: 비정형 문제에 접근하는 사고 습관과 서술 능력
        exit_criteria: 사고력 교재 심화 단계 소화, 경시 입문 레벨테스트 통과
        grade: [1, 4]
        depth: 1
        lane: 0
      - id: math_el_competition
        title: 경시 · 심화
        subtitle: KMO 입문 · 최상위 심화
        goal: 학년 초월 심화 문제 해결력
        exit_criteria: 경시 입상 또는 심화 교재(최상위/최고수준) 완주
        grade: [4, 6]
        depth: 2
        lane: 0
      - id: math_el_preview
        title: 중등 선행
        subtitle: 중1~중2 과정 선행
        goal: 중등 진학 전 1~2년 선행 확보
        exit_criteria: 중등 과정 개념 완료 + 심화 문제집 1회독
        grade: [5, 6]
        depth: 3
        lane: 1
    edges:
      - [math_el_basic, math_el_thinking, "초1~2 시작이 일반적. 늦어도 초3 전.", standard]
      - [math_el_thinking, math_el_competition, "초4 전후, 레벨테스트 통과 필요.", standard]
      - [math_el_thinking, math_el_preview, "경시를 타지 않고 선행으로 직행하는 루트.", alternative]
      - [math_el_competition, math_el_preview, "초5~6, 경시와 선행 병행이 대치의 표준.", standard]
      - [math_el_basic, math_el_preview, "사고력 없이 연산·교과에서 바로 선행. 목동·잠실에서 흔함.", alternative]

  - id: math_middle
    subject: math
    school_level: middle
    title: 중등 수학
    summary: 내신·심화·고등선행 세 갈래가 동시에 돌아가는 구간. 영재고/과학고 지원 여부가 루트를 가른다.
    sort_order: 1
    stages:
      - id: math_mid_naesin
        title: 중등 내신
        subtitle: 학교별 기출 대비
        goal: 중간·기말 90점대 유지
        exit_criteria: 내신 A 안정권
        grade: [7, 9]
        depth: 0
        lane: 1
      - id: math_mid_kmo
        title: 심화 · KMO
        subtitle: 올림피아드 대비
        goal: 정수론·조합·기하 등 경시 영역 훈련
        exit_criteria: KMO 1차 통과 또는 교내 경시 상위권
        grade: [7, 8]
        depth: 1
        lane: 0
      - id: math_mid_preview
        title: 고등 선행
        subtitle: 공통수학 → 대수 · 미적분I
        goal: 고1 과정 선행 완료
        exit_criteria: 고1 모의고사 1등급 수준
        grade: [8, 9]
        depth: 2
        lane: 1
      - id: math_mid_yeongjae
        title: 영재고 · 과학고 대비
        subtitle: 구술 · 심층면접
        goal: 서술형 · 구술 대응력
        exit_criteria: 영재고 2단계 전형 대응 가능
        grade: [8, 9]
        depth: 2
        lane: 0
    edges:
      - [math_mid_naesin, math_mid_kmo, "중1 상위권 진입 후 분기.", standard]
      - [math_mid_naesin, math_mid_preview, "내신 안정 후 중2부터 고등 선행. 가장 일반적인 루트.", standard]
      - [math_mid_kmo, math_mid_yeongjae, "경시 실적을 영재고 전형으로 연결.", standard]
      - [math_mid_kmo, math_mid_preview, "경시 종료 후 선행 합류.", standard]

  - id: math_high
    subject: math
    school_level: high
    title: 고등 수학
    summary: 내신과 수능이 분리되는 구간. 의대·최상위 라인은 별도 트랙으로 관리된다.
    sort_order: 2
    stages:
      - id: math_hi_naesin
        title: 고등 내신
        subtitle: 학교별 시험 대비
        goal: 1~2등급 확보
        exit_criteria: 내신 1등급대 유지
        grade: [10, 12]
        depth: 0
        lane: 1
      - id: math_hi_suneung
        title: 수능 수학
        subtitle: 미적분 · 기하 · 확통
        goal: 수능 수학 1등급
        exit_criteria: 모의고사 안정 1등급
        grade: [10, 12]
        depth: 1
        lane: 1
      - id: math_hi_top
        title: 의대 · 최상위 심화
        subtitle: 킬러문항 · 준킬러 훈련
        goal: 만점 방어력
        exit_criteria: 고난도 세트 안정 정답률
        grade: [11, 12]
        depth: 2
        lane: 0
      - id: math_hi_nsu
        title: 재수 · N수
        subtitle: 재종반 · 단과
        goal: 목표 대학 재도전
        exit_criteria: 목표 등급 도달
        grade: [12, 12]
        depth: 3
        lane: 1
    edges:
      - [math_hi_naesin, math_hi_suneung, "고2 겨울 전환이 표준.", standard]
      - [math_hi_suneung, math_hi_top, "1등급 확보 후 최상위 심화 진입.", standard]
      - [math_hi_suneung, math_hi_nsu, "", standard]
      - [math_hi_top, math_hi_nsu, "", standard]

  # ══════════════════════ 영어 ══════════════════════
  - id: english_elementary
    subject: english
    school_level: elementary
    title: 초등 영어
    summary: 어학원 레벨 체계가 곧 테크트리. 레벨테스트 통과 시점이 이후 루트를 결정한다.
    sort_order: 3
    stages:
      - id: eng_el_phonics
        title: 파닉스 · 리딩 기초
        subtitle: 소리와 문자 결합
        goal: 자기 수준 원서 독립 읽기
        exit_criteria: AR 2점대 자력 독해
        grade: [1, 3]
        depth: 0
        lane: 1
      - id: eng_el_academy
        title: 어학원 정규 과정
        subtitle: 레벨 기반 정규반
        goal: 4대 영역 균형 발달
        exit_criteria: 어학원 중상위 레벨 진입
        grade: [2, 6]
        depth: 1
        lane: 1
      - id: eng_el_rw
        title: 리딩 · 라이팅 심화
        subtitle: 에세이 · 디베이트
        goal: 논리적 영작과 토론
        exit_criteria: 5문단 에세이 자력 작성
        grade: [4, 6]
        depth: 2
        lane: 0
      - id: eng_el_bridge
        title: 중등 내신 · 시험 준비
        subtitle: 문법 체계화 · 토플 입문
        goal: 중등 내신 대응 문법 체계
        exit_criteria: 중등 문법 1회독 + 토플 주니어 대응
        grade: [5, 6]
        depth: 3
        lane: 1
    edges:
      - [eng_el_phonics, eng_el_academy, "레벨테스트 통과가 관문.", standard]
      - [eng_el_academy, eng_el_rw, "상위 레벨 진입 시 심화 분기.", standard]
      - [eng_el_academy, eng_el_bridge, "초6 전후 내신 대비로 전환.", standard]
      - [eng_el_rw, eng_el_bridge, "심화 후 내신·시험 체제로 합류.", standard]

  - id: english_middle
    subject: english
    school_level: middle
    title: 중등 영어
    summary: 내신과 특목고 대비(토플·텝스)가 갈라지고, 중3에 수능형으로 수렴한다.
    sort_order: 4
    stages:
      - id: eng_mid_naesin
        title: 중등 내신 영어
        subtitle: 학교별 기출 · 서술형
        goal: 내신 A 확보
        exit_criteria: 서술형 감점 최소화
        grade: [7, 9]
        depth: 0
        lane: 1
      - id: eng_mid_test
        title: 토플 · 텝스
        subtitle: 특목고 · 국제고 대비
        goal: 공인 성적 확보
        exit_criteria: 토플 100+ 또는 텝스 목표 점수
        grade: [7, 9]
        depth: 1
        lane: 0
      - id: eng_mid_preview
        title: 고등 선행
        subtitle: 수능형 독해 · 어법
        goal: 고1 모의고사 대응
        exit_criteria: 고1 모의 1등급
        grade: [8, 9]
        depth: 2
        lane: 1
    edges:
      - [eng_mid_naesin, eng_mid_test, "특목고 지망 시 분기.", standard]
      - [eng_mid_naesin, eng_mid_preview, "", standard]
      - [eng_mid_test, eng_mid_preview, "공인 성적 확보 후 수능형 전환.", standard]

  - id: english_high
    subject: english
    school_level: high
    title: 고등 영어
    summary: 절대평가 전환 이후 내신 비중이 커진 구간. 논술·심화는 최상위 라인에서만 유지된다.
    sort_order: 5
    stages:
      - id: eng_hi_naesin
        title: 고등 내신
        subtitle: 학교별 변형 문제
        goal: 1등급 확보
        exit_criteria: 내신 1등급대
        grade: [10, 12]
        depth: 0
        lane: 1
      - id: eng_hi_suneung
        title: 수능 영어
        subtitle: 절대평가 1등급
        goal: 90점 안정 확보
        exit_criteria: 모의 안정 1등급
        grade: [10, 12]
        depth: 1
        lane: 1
      - id: eng_hi_adv
        title: 논술 · 심화 영어
        subtitle: 대학별 영어 논술
        goal: 대학별 전형 대응
        exit_criteria: 기출 대응 가능
        grade: [11, 12]
        depth: 2
        lane: 0
    edges:
      - [eng_hi_naesin, eng_hi_suneung, "", standard]
      - [eng_hi_suneung, eng_hi_adv, "지원 전형에 따라 선택.", alternative]

  # ══════════════════════ 국어 · 논술 ══════════════════════
  - id: korean_elementary
    subject: korean
    school_level: elementary
    title: 초등 국어 · 논술
    summary: 독서에서 문해력으로, 다시 중등 선행으로. 성과가 늦게 드러나 이탈이 잦은 구간.
    sort_order: 6
    stages:
      - id: kor_el_reading
        title: 독서 · 논술 기초
        subtitle: 읽고 말하고 쓰기
        goal: 읽기 습관과 요약 능력
        exit_criteria: 한 편 글의 주제 요약 가능
        grade: [1, 4]
        depth: 0
        lane: 1
      - id: kor_el_literacy
        title: 문해력 · 어휘
        subtitle: 비문학 독해 입문
        goal: 학년 이상 지문 독해
        exit_criteria: 비문학 지문 정답률 80%
        grade: [3, 6]
        depth: 1
        lane: 1
      - id: kor_el_preview
        title: 중등 국어 선행
        subtitle: 문법 · 문학 개념
        goal: 중등 국어 개념 선행
        exit_criteria: 중등 문법 1회독
        grade: [5, 6]
        depth: 2
        lane: 1
    edges:
      - [kor_el_reading, kor_el_literacy, "", standard]
      - [kor_el_literacy, kor_el_preview, "", standard]

  - id: korean_middle
    subject: korean
    school_level: middle
    title: 중등 국어
    summary: 내신에서 수능형 비문학으로 넘어가는 구간.
    sort_order: 7
    stages:
      - id: kor_mid_naesin
        title: 중등 내신 국어
        subtitle: 교과서 · 서술형
        goal: 내신 A
        exit_criteria: 서술형 대응 가능
        grade: [7, 9]
        depth: 0
        lane: 1
      - id: kor_mid_deep
        title: 문법 · 문학 심화
        subtitle: 개념 체계화
        goal: 문법 체계 완성
        exit_criteria: 고등 문법 선행 가능
        grade: [8, 9]
        depth: 1
        lane: 0
      - id: kor_mid_preview
        title: 고등 국어 선행
        subtitle: 수능형 비문학
        goal: 고1 모의 대응
        exit_criteria: 비문학 정답률 안정
        grade: [8, 9]
        depth: 2
        lane: 1
    edges:
      - [kor_mid_naesin, kor_mid_deep, "", standard]
      - [kor_mid_naesin, kor_mid_preview, "", standard]
      - [kor_mid_deep, kor_mid_preview, "", standard]

  - id: korean_high
    subject: korean
    school_level: high
    title: 고등 국어 · 논술
    summary: 수능 국어가 최상위 변별 과목이 되면서 대치·목동 모두 투자 비중이 커진 구간.
    sort_order: 8
    stages:
      - id: kor_hi_naesin
        title: 고등 내신 국어
        subtitle: 학교별 지문 분석
        goal: 1등급
        exit_criteria: 내신 1등급대
        grade: [10, 12]
        depth: 0
        lane: 1
      - id: kor_hi_suneung
        title: 수능 국어
        subtitle: 비문학 · 문학 · 화작문
        goal: 수능 1등급
        exit_criteria: 모의 안정 1등급
        grade: [10, 12]
        depth: 1
        lane: 1
      - id: kor_hi_nonsul
        title: 대학별 논술
        subtitle: 인문 · 사회 논술
        goal: 대학별 기출 대응
        exit_criteria: 첨삭 기준 통과
        grade: [11, 12]
        depth: 2
        lane: 0
    edges:
      - [kor_hi_naesin, kor_hi_suneung, "", standard]
      - [kor_hi_suneung, kor_hi_nonsul, "논술 전형 지원 시.", alternative]

  # ══════════════════════ 과학 ══════════════════════
  - id: science_elementary
    subject: science
    school_level: elementary
    title: 초등 과학
    summary: 실험·탐구에서 영재원으로. 영재원 실적이 이후 영재고 루트의 출발점이 된다.
    sort_order: 9
    stages:
      - id: sci_el_lab
        title: 실험 · 탐구
        subtitle: 체험형 과학
        goal: 과학적 호기심과 실험 설계 감각
        exit_criteria: 탐구보고서 자력 작성
        grade: [1, 4]
        depth: 0
        lane: 1
      - id: sci_el_gifted
        title: 영재원 대비
        subtitle: 교육청 · 대학부설
        goal: 영재원 선발
        exit_criteria: 영재원 합격
        grade: [4, 6]
        depth: 1
        lane: 0
      - id: sci_el_preview
        title: 중등 과학 선행
        subtitle: 중등 개념 진입
        goal: 중등 과학 개념 선행
        exit_criteria: 중1~2 과정 완료
        grade: [5, 6]
        depth: 2
        lane: 1
    edges:
      - [sci_el_lab, sci_el_gifted, "초4 전후 선발 시기.", standard]
      - [sci_el_lab, sci_el_preview, "", alternative]
      - [sci_el_gifted, sci_el_preview, "", standard]

  - id: science_middle
    subject: science
    school_level: middle
    title: 중등 과학
    summary: 영재고·과학고 지원 여부가 루트를 완전히 가른다. 중2가 분기점.
    sort_order: 10
    stages:
      - id: sci_mid_naesin
        title: 중등 과학 내신
        subtitle: 학교 시험 대비
        goal: 내신 A
        exit_criteria: 내신 A 안정
        grade: [7, 9]
        depth: 0
        lane: 1
      - id: sci_mid_preview
        title: 물화생지 개념 선행
        subtitle: 고1 통합과학 → 과탐I
        goal: 고등 과학 선행
        exit_criteria: 과탐 I 1회독
        grade: [8, 9]
        depth: 1
        lane: 1
      - id: sci_mid_olympiad
        title: 영재고 · 과학고 대비
        subtitle: 올림피아드 · 구술
        goal: 영재고 전형 대응
        exit_criteria: 2단계 전형 대응 가능
        grade: [8, 9]
        depth: 2
        lane: 0
