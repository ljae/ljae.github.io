# ─────────────────────────────────────────────────────────────────────
# 에듀트리 테크트리 큐레이션 데이터
#
# 학년 코드: 예비초=0, 초1=1 … 초6=6, 중1=7 … 중3=9, 고1=10 … 고3=12
# depth = 그래프 가로축(진행 순서), lane = 세로축(병렬 루트)
#
# ★ 편집 원칙
#   - 엣지는 커뮤니티에서 반복 관찰되는 경로만 등재한다.
#   - evidence_count 는 파이프라인이 자동으로 채운다. 손으로 넣지 않는다.
#   - edge_type: standard(일반) | accelerated(속진) | alternative(우회)
# ─────────────────────────────────────────────────────────────────────

# 통합 로드맵의 이정표. 연령 축에서 굵은 마디가 되는 시점들.
# 학원가에서 반복 관찰되는 표준 시점이며, 개별 아이의 정답이 아니다.
roadmap_milestones:
  - grade: -2
    label: 영어 시작
    note: 영어유치원 5세 입학. 레벨테스트 없이 들어가는 마지막 시기.
  - grade: -1
    label: 수학 시작
    note: 사고력 수학 6세 입학이 표준으로 굳어졌다.
  - grade: 0
    label: 국어 시작
    note: 독서·토론·논술 7세 시작. 대기 1년을 감안해 움직인다.
  - grade: 4
    label: 본격 레이스
    note: 초4를 기점으로 수학 중심으로 재편. 경시·선행 분기가 여기서 갈린다.
  - grade: 7
    label: 중등 전환
    note: 내신 체제 시작. 특목·자사 지원 여부가 루트를 가른다.

# ─────────────────────────────────────────────────────────────────────
# 진로 목적지 — 테크트리의 종점
#
# 단계(stages)가 '무엇을 배우는가' 라면 목적지는 '어디로 가는가' 다.
# 학부모가 실제로 붙들고 있는 것은 후자다 — 의대, 유학, 영재고.
#
# ★ 이것은 **큐레이션**이다. 후기에서 추론하지 않는다.
#   목적지 신호를 실측하니 글 2.3% 뿐이라 학원에 딱지를 붙일 수는 없다.
#   하지만 '의대는 과탐II와 수학 최상위를 지난다'는 후기로 알아낼 지식이
#   아니라 이미 아는 사실이다. 근거가 얇다는 것은 학원 연결을 못 한다는
#   뜻이지, 길을 못 그린다는 뜻이 아니다.
#
# requires: 지나야 하는 **기존 단계 id**. 새 단계를 만들지 않는다.
#           존재하지 않는 id 를 적으면 빌드가 경고한다(조용히 비지 않는다).
# gates:    되돌리기 어려운 분기점. 이 서비스가 줄 수 있는 가장 실용적인 정보다.
# linkable: false 면 학원을 연결하지 않는다 — 길은 보여 주되 누가 그 길인지는
#           말하지 않는다. 근거가 얇은 목적지에 쓴다.
# ─────────────────────────────────────────────────────────────────────
destinations:
  - id: dest_medical
    label: 의대 · 의치한
    axis: 국내입시
    sort_order: 0
    summary: 과탐 II 와 수학 최상위가 갈림길. 영어는 절대평가라 비중이 낮다.
    requires:
      math:    [math_hi_naesin, math_hi_suneung, math_hi_top]
      science: [sci_hi_naesin, sci_hi_suneung, sci_hi_two]
      korean:  [kor_hi_suneung]
    gates:
      - grade: 10
        note: 고1 내신이 사실상 전제. 여기서 대부분 갈린다.
      - grade: 11
        note: 과탐 II 선택. 안 고르면 상위권 지원 폭이 줄어든다.

  - id: dest_snu_top
    label: 서울대 · 최상위 국내
    axis: 국내입시
    sort_order: 1
    summary: 내신·수능·논술 세 갈래를 모두 열어 두는 가장 넓은 길.
    requires:
      math:    [math_hi_naesin, math_hi_suneung, math_hi_top]
      korean:  [kor_hi_suneung, kor_hi_nonsul]
      english: [eng_hi_suneung, eng_hi_adv]
      science: [sci_hi_suneung]
    gates:
      - grade: 10
        note: 내신 산출 시작. 수시·정시 비중이 여기서 정해지기 시작한다.
      - grade: 11
        note: 논술 준비 여부 결정. 대학별 고사는 따로 준비해야 한다.

  - id: dest_abroad
    label: 해외대학 · 유학
    axis: 해외
    sort_order: 2
    summary: 국내 입시와 거의 겹치지 않는 길. 초등 영어 축적이 그대로 자산이 된다.
    requires:
      english: [eng_el_phonics, eng_el_academy, eng_el_rw, eng_mid_test]
      math:    [math_el_basic, math_mid_preview]
    gates:
      - grade: 1
        note: 리딩 축적이 뒤에 대체 불가. 이 길의 진짜 관문은 초등에 있다.
      - grade: 8
        note: 국내 내신 트랙과 갈라지는 지점. 토플·SAT 로 방향을 튼다.

  - id: dest_science_hs
    label: 영재고 · 과학고
    axis: 특목
    sort_order: 3
    summary: 가장 이르게 갈리는 길. 초4 영재원 선발이 실질적 출발선이다.
    requires:
      math:    [math_el_thinking, math_el_competition, math_mid_kmo, math_mid_yeongjae]
      science: [sci_el_lab, sci_el_gifted, sci_mid_olympiad]
    gates:
      - grade: 4
        note: 영재원 선발. 실적이 이후 루트의 입장권이 된다.
      - grade: 8
        note: KMO. 이때 시작하면 늦다는 것이 학원가의 통설이다.

  - id: dest_foreign_hs
    label: 외고 · 국제고 · 자사고
    axis: 특목
    sort_order: 4
    summary: 중등 내신과 영어 공인시험이 함께 간다.
    requires:
      english: [eng_el_academy, eng_mid_naesin, eng_mid_test]
      math:    [math_mid_naesin, math_mid_preview]
      korean:  [kor_mid_naesin, kor_mid_deep]
    gates:
      - grade: 7
        note: 내신 산출 시작. 특목 지원 여부가 여기서 정해진다.

  - id: dest_early
    label: 조기졸업 · 검정고시
    axis: 기타
    sort_order: 5
    linkable: false
    summary: 선행을 극대화해 학년을 앞당기는 길. 후기 근거가 얇어 학원을 연결하지 않는다.
    requires:
      math:    [math_el_preview, math_mid_preview]
    gates:
      - grade: 6
        note: 중등 과정 선행 완료 여부가 갈림길.

  - id: dest_art
    label: 예체능 입시
    axis: 기타
    sort_order: 6
    linkable: false
    summary: 실기 중심이라 교과 테크트리와 축이 다르다. 길만 표시하고 단계를 잇지 않는다.
    requires: {}
    gates:
      - grade: 9
        note: 예고 지원 여부. 실기 준비 기간을 역산해 정한다.

tracks:
  # ══════════════════════ 수학 ══════════════════════
  - id: math_elementary
    subject: math
    school_level: elementary
    title: 초등 수학
    summary: 연산에서 출발해 사고력을 거쳐 경시·심화 또는 중등 선행으로 갈라지는 구간. 4개 학군에서 경쟁이 가장 치열하다.
    band_summaries:
      elem_low: 연산과 교과 기본을 세우고, 사고력으로 넓히는 구간. 예비초에 연산부터 시작하는 것이 4개 학군의 표준이다.
      elem_high: 사고력에서 경시·심화로 갈지, 중등 선행으로 틀지 갈라지는 구간. 초4 전후 레벨테스트가 분기점이다.
    sort_order: 0
    stages:
      - id: math_el_basic
        title: 연산 · 교과 기본
        subtitle: 학교 진도 + 연산 숙련
        goal: 학년 교과 개념을 빠짐없이, 연산 정확도 95% 이상
        exit_criteria: 학년 교과 단원평가 안정적 만점, 연산 속도 학년 기준 이상
        # 초3 에서 끊어 두었더니 초4~6 구간에 '교과' 단계가 없어져,
        # 단서 없는 평범한 수학학원이 전부 '경시 · 심화' 로 배정됐다.
        # 학교 진도와 연산은 초6까지 이어진다 — 사실대로 초6까지 둔다.
        grade: [0, 6]
        depth: 0
        lane: 1
      - id: math_el_thinking
        title: 사고력 · 창의수학
        subtitle: 6세 입학이 표준 · 교구 · 퍼즐 · 서술형
        goal: 비정형 문제에 접근하는 사고 습관과 서술 능력
        exit_criteria: 사고력 교재 심화 단계 소화, 경시 입문 레벨테스트 통과
        grade: [-1, 4]
        depth: 1
        lane: 0
      - id: math_el_competition
        title: 경시 · 심화
        subtitle: KMO 입문 · 최상위 심화
        goal: 학년 초월 심화 문제 해결력
        exit_criteria: 경시 입상 또는 심화 교재(최상위/최고수준) 완주
        grade: [4, 6]
        depth: 2
        lane: 0
      - id: math_el_preview
        title: 중등 선행
        subtitle: 중1~중2 과정 선행
        goal: 중등 진학 전 1~2년 선행 확보
        exit_criteria: 중등 과정 개념 완료 + 심화 문제집 1회독
        grade: [5, 6]
        depth: 3
        lane: 1
    edges:
      - [math_el_basic, math_el_thinking, "초1~2 시작이 일반적. 늦어도 초3 전.", standard]
      - [math_el_thinking, math_el_competition, "초4 전후, 레벨테스트 통과 필요.", standard]
      - [math_el_thinking, math_el_preview, "경시를 타지 않고 선행으로 직행하는 루트.", alternative]
      - [math_el_competition, math_el_preview, "초5~6, 경시와 선행 병행이 대치의 표준.", standard]
      - [math_el_basic, math_el_preview, "사고력 없이 연산·교과에서 바로 선행. 목동·잠실에서 흔함.", alternative]

  - id: math_middle
    subject: math
    school_level: middle
    title: 중등 수학
    summary: 내신·심화·고등선행 세 갈래가 동시에 돌아가는 구간. 영재고/과학고 지원 여부가 루트를 가른다.
    sort_order: 1
    stages:
      - id: math_mid_naesin
        title: 중등 내신
        subtitle: 학교별 기출 대비
        goal: 중간·기말 90점대 유지
        exit_criteria: 내신 A 안정권
        grade: [7, 9]
        depth: 0
        lane: 1
      - id: math_mid_kmo
        title: 심화 · KMO
        subtitle: 올림피아드 대비
        goal: 정수론·조합·기하 등 경시 영역 훈련
        exit_criteria: KMO 1차 통과 또는 교내 경시 상위권
        grade: [7, 8]
        depth: 1
        lane: 0
      - id: math_mid_preview
        title: 고등 선행
        subtitle: 공통수학 → 대수 · 미적분I
        goal: 고1 과정 선행 완료
        exit_criteria: 고1 모의고사 1등급 수준
        grade: [8, 9]
        depth: 2
        lane: 1
      - id: math_mid_yeongjae
        title: 영재고 · 과학고 대비
        subtitle: 구술 · 심층면접
        goal: 서술형 · 구술 대응력
        exit_criteria: 영재고 2단계 전형 대응 가능
        grade: [8, 9]
        depth: 2
        lane: 0
    edges:
      - [math_mid_naesin, math_mid_kmo, "중1 상위권 진입 후 분기.", standard]
      - [math_mid_naesin, math_mid_preview, "내신 안정 후 중2부터 고등 선행. 가장 일반적인 루트.", standard]
      - [math_mid_kmo, math_mid_yeongjae, "경시 실적을 영재고 전형으로 연결.", standard]
      - [math_mid_kmo, math_mid_preview, "경시 종료 후 선행 합류.", standard]

  - id: math_high
    subject: math
    school_level: high
    title: 고등 수학
    summary: 내신과 수능이 분리되는 구간. 의대·최상위 라인은 별도 트랙으로 관리된다.
    sort_order: 2
    stages:
      - id: math_hi_naesin
        title: 고등 내신
        subtitle: 학교별 시험 대비
        goal: 1~2등급 확보
        exit_criteria: 내신 1등급대 유지
        grade: [10, 12]
        depth: 0
        lane: 1
      - id: math_hi_suneung
        title: 수능 수학
        subtitle: 미적분 · 기하 · 확통
        goal: 수능 수학 1등급
        exit_criteria: 모의고사 안정 1등급
        grade: [10, 12]
        depth: 1
        lane: 1
      - id: math_hi_top
        title: 의대 · 최상위 심화
        subtitle: 킬러문항 · 준킬러 훈련
        goal: 만점 방어력
        exit_criteria: 고난도 세트 안정 정답률
        grade: [11, 12]
        depth: 2
        lane: 0
      - id: math_hi_nsu
        title: 재수 · N수
        subtitle: 재종반 · 단과
        goal: 목표 대학 재도전
        exit_criteria: 목표 등급 도달
        grade: [12, 12]
        depth: 3
        lane: 1
    edges:
      - [math_hi_naesin, math_hi_suneung, "고2 겨울 전환이 표준.", standard]
      - [math_hi_suneung, math_hi_top, "1등급 확보 후 최상위 심화 진입.", standard]
      - [math_hi_suneung, math_hi_nsu, "", standard]
      - [math_hi_top, math_hi_nsu, "", standard]

  # ══════════════════════ 영어 ══════════════════════
  - id: english_elementary
    subject: english
    school_level: elementary
    title: 초등 영어
    summary: 어학원 레벨 체계가 곧 테크트리. 레벨테스트 통과 시점이 이후 루트를 결정한다.
    band_summaries:
      elem_low: 파닉스로 소리와 문자를 붙이고 어학원 정규 과정에 진입하는 구간. 레벨테스트 첫 응시가 여기서 일어난다.
      elem_high: 어학원 레벨 체계가 곧 테크트리. 리딩·라이팅 심화와 중등 내신 준비로 갈라진다.
    sort_order: 3
    stages:
      # 유아 구간은 로드맵 전용이다. 5~6세 영유를 순위에 세울 근거
      # 데이터가 없으므로 랭킹·수집 어디에도 연결하지 않는다.
      - id: eng_kindy
        title: 영어유치원
        subtitle: 5세 입학 · 레벨테스트 없이 시작
        goal: 영어 노출 환경에서 소리·표현 습득
        exit_criteria: 졸업 후 어학원 정규 과정 레벨테스트
        grade: [-2, 0]
        depth: 0
        lane: 0
        roadmap_only: true
      - id: eng_el_phonics
        title: 파닉스 · 리딩 기초
        subtitle: 소리와 문자 결합
        goal: 자기 수준 원서 독립 읽기
        exit_criteria: AR 2점대 자력 독해
        grade: [0, 3]
        depth: 0
        lane: 1
      - id: eng_el_academy
        title: 어학원 정규 과정
        subtitle: 레벨 기반 정규반
        goal: 4대 영역 균형 발달
        exit_criteria: 어학원 중상위 레벨 진입
        grade: [2, 6]
        depth: 1
        lane: 1
      - id: eng_el_rw
        title: 리딩 · 라이팅 심화
        subtitle: 에세이 · 디베이트
        goal: 논리적 영작과 토론
        exit_criteria: 5문단 에세이 자력 작성
        grade: [4, 6]
        depth: 2
        lane: 0
      - id: eng_el_bridge
        title: 중등 내신 · 시험 준비
        subtitle: 문법 체계화 · 토플 입문
        goal: 중등 내신 대응 문법 체계
        exit_criteria: 중등 문법 1회독 + 토플 주니어 대응
        grade: [5, 6]
        depth: 3
        lane: 1
    edges:
      - [eng_kindy, eng_el_academy, "영유 졸업 후 어학원 정규로. 합격자 수로 영유 서열이 매겨질 만큼 표준 경로다.", standard]
      - [eng_kindy, eng_el_phonics, "일반 유치원 출신은 파닉스부터 합류.", alternative]
      - [eng_el_phonics, eng_el_academy, "레벨테스트 통과가 관문.", standard]
