# ─────────────────────────────────────────────────────────────────────
# 시드 학원 로스터 — 데모/개발용
#
# ★ 중요
#   - 여기 실린 항목은 전부 data_source: seed 로 저장되고 UI에 "샘플" 칩이 붙는다.
#   - NEIS 동기화가 성공하면 aca_asnum 기준으로 검증된 레코드가 이 값을 덮어쓴다.
#   - 시드 점수는 합성값이다. 실제 평가가 아니며 앱이 데모 모드 배너로 명시한다.
#   - regions 는 "해당 학군에 지점이 있는가"만 표시한다. 지점별 상세는 NEIS가 채운다.
# ─────────────────────────────────────────────────────────────────────

