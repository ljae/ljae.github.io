# ─────────────────────────────────────────────────────────────────────
# 공동주택 API 에 없는 단지 — 손으로 보완한다.
#
# data.go.kr 공동주택(AptListService3)은 **의무관리대상**만 담는다.
# 보통 300세대 이상, 또는 승강기가 있는 150세대 이상이다. 그 아래
# 소규모 단지는 API 에 아예 존재하지 않아 수집으로는 닿을 수 없다.
#
# 학군 안의 소규모 단지가 통째로 빠지면 '우리 아파트는 어느 학교인가'에
# 답을 못 한다. 학부모가 가장 많이 묻는 질문이라 빠뜨릴 수 없다.
#
# ★ 넣는 법
#   - address 는 도로명주소. 좌표는 파이프라인이 지오코딩으로 채운다.
#   - lat/lng 를 직접 적어도 되지만, 주소만 두는 편이 유지하기 쉽다.
#   - 학교 배정은 여기 적지 않는다. 좌표 + 학구 폴리곤으로 계산된다.
#   - households 는 아는 값만. 모르면 비워 둔다(추측해 넣지 않는다).
# ─────────────────────────────────────────────────────────────────────

apartments:
  - name: 대치 푸르지오 발라드
    region_id: daechi
    dong: 개포동
    address: 서울특별시 강남구 개포로 407
    households: 78
    # 구룡역 바로 앞, 우성8차 옆. 78세대라 의무관리대상이 아니어서
    # 공동주택 API 에 없다.
