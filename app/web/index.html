  <script>
    // 예전 배포에서 등록된 서비스워커가 낡은 main.dart.js 를 붙잡고 있어,
    // 새로 배포해도 사용자는 바뀐 화면을 보지 못한다(로고를 키웠는데 그대로
    // 보이던 원인). 빌드에서 서비스워커를 끄는 것만으로는 부족하다 —
    // 이미 등록된 것은 브라우저에 남아 계속 캐시를 물고 있기 때문이다.
    // 그래서 매 로드마다 등록을 해제하고 캐시를 비운다.
    // 순위가 매일 갱신되는 서비스라 오프라인 캐시보다 최신성이 중요하다.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys()
        .then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); })
        .catch(function () {});
    }
  </script>
  <script>
    // 네이버 지도 키. 배포 워크플로가 시크릿 값으로 치환한다.
    // 치환되지 않았으면(로컬·키 미등록) 지도 SDK 를 아예 부르지 않고,
    // 앱은 좌표 없이도 동작하는 모식도 지도로 떨어진다.
    window.__NAVER_MAP_KEY_ID__ = '__NAVER_MAP_KEY_ID__';
    window.__NAVER_MAP_READY__ = false;
    (function () {
      var key = window.__NAVER_MAP_KEY_ID__;
      if (!key || key.indexOf('__') === 0) return;
      // 인증 실패 시 네이버가 이 함수를 부른다. 조용히 실패하지 않도록 잡아 둔다.
      window.navermap_authFailure = function () {
        window.__NAVER_MAP_READY__ = false;
        console.warn('네이버 지도 인증 실패 — 콘솔의 도메인 허용목록을 확인하세요.');
      };
      var s = document.createElement('script');
      s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' +
              encodeURIComponent(key);
      s.async = true;
      s.onload = function () { window.__NAVER_MAP_READY__ = true; };
      document.head.appendChild(s);
    })();
  </script>
  <script>
    // 네이버 지도 얇은 래퍼.
    // 지도 API 전체를 Dart 로 모델링하지 않고, 필요한 동작만 여기서 노출한다.
    // Flutter 쪽 인터롭 표면이 작을수록 SDK 가 바뀌어도 덜 깨진다.
    window.hakwonMap = (function () {
      var instances = {};
      function ready() { return !!(window.naver && window.naver.maps); }

      // ── 이름표 접기 ────────────────────────────────────────────────
      //
      // 지도를 학군에 고정하고 나니 한 화면에 이름표가 너무 많아졌다.
      // 실측: 대치 36교 + 79단지, 반포 28교 + 132단지. 확대로 흩을 수도
      // 없으니(고정이다) 겹치는 것은 **점으로 접는다.**
      //
      // 지우지 않고 접는 이유: 점도 눌러서 볼 수 있다. 없애면 '그 자리에
      // 아무것도 없다' 가 되지만, 접으면 '겹쳐 있다' 가 된다.
      //
      // 순서는 z 가 정한다 — 학교(3)가 아파트(2)보다 먼저 이름을 얻는다.
      // 학군지도에 온 사람이 찾는 것은 학교고, 아파트는 맥락이다.
      // 학교는 큰 이름표, 아파트는 작은 이름표. 같은 크기로 두면 단지가
      // 전부 접혀 '아파트가 없다' 로 보인다 — 실제로 한 번 그렇게 됐다.
      function metrics(it) {
        return it.small
          ? { font: 10, pad: 5, per: 9.8, h: 17 }
          : { font: 11.5, pad: 9, per: 11.2, h: 22 };
      }

      function labelWidth(it) {
        var m = metrics(it);
        return String(it.label || '').length * m.per + m.pad * 2 + 4;
      }

      function labelIcon(it) {
        var m = metrics(it);
        return {
          content:
            '<div style="transform:translate(-50%,-50%);white-space:nowrap;' +
            'font-family:Paperlogy,-apple-system,sans-serif;font-size:' + m.font + 'px;' +
            'font-weight:700;letter-spacing:-.3px;color:#fff;padding:3px ' + m.pad + 'px;' +
            'border-radius:999px;background:' + it.color + ';' +
            'box-shadow:0 2px 8px rgba(0,0,0,.28);border:1.5px solid rgba(255,255,255,.85)">' +
            it.label + '</div>',
          anchor: new naver.maps.Point(0, 0)
        };
      }

      function dotIcon(it) {
        return {
          content:
            '<div title="' + (it.label || '') + '" ' +
            'style="transform:translate(-50%,-50%);width:11px;height:11px;' +
            'border-radius:999px;background:' + it.color + ';' +
            'border:1.5px solid rgba(255,255,255,.9);' +
            'box-shadow:0 1px 4px rgba(0,0,0,.3)"></div>',
          anchor: new naver.maps.Point(0, 0)
        };
      }

      /** 첫 화면을 울타리로 굳힌다. 맞추기가 끝난 뒤에만 부른다. */
      function lock(map) {
        if (!map.__relock) return;
        map.__relock = false;
        map.setOptions({
          // 축소는 첫 화면까지. 그보다 멀어지면 학군 밖이 보인다.
          minZoom: map.getZoom(),
          // 이동은 첫 화면이 담은 범위 안에서. 마커 경계가 아니라
          // **실제로 보이던 범위**를 쓴다 — 마커 경계로 묶으면 여백만큼
          // 화면이 울타리보다 커서 지도가 계속 튕긴다.
          maxBounds: map.getBounds()
        });
      }

      function declutter(map) {
        var proj = map.getProjection();
        if (!proj) return;
        var placed = [];
        var rows = (map.__markers || []).slice().sort(function (a, b) {
          return ((b.__it && b.__it.z) || 0) - ((a.__it && a.__it.z) || 0);
        });
        rows.forEach(function (m) {
          var it = m.__it;
          if (!it) return;
          var off = proj.fromCoordToOffset(m.getPosition());
          var w = labelWidth(it), h = metrics(it).h;
          var box = {
            l: off.x - w / 2, r: off.x + w / 2,
            t: off.y - h / 2, b: off.y + h / 2
          };
          var hit = placed.some(function (p) {
            return !(box.r < p.l || box.l > p.r || box.b < p.t || box.t > p.b);
          });
          m.setIcon(hit ? dotIcon(it) : labelIcon(it));
          if (!hit) placed.push(box);
        });
      }

      function init(id, lat, lng, zoom, payload) {
        if (!ready()) return false;
        var el = document.getElementById(id);
        if (!el) return false;
        var map = instances[id];
        if (!map) {
          map = new naver.maps.Map(el, {
            center: new naver.maps.LatLng(lat, lng),
            zoom: zoom,
            mapTypeControl: false,
            scaleControl: false,
            mapDataControl: false,
            // ★ **첫 화면이 바깥 울타리다.** 한때 통째로 잠갔는데, 밀집
            //   구역에서 이름표가 겹쳐도 들여다볼 방법이 없었다. 그렇다고
            //   다 열어 두면 서울 밖으로 끌고 나가 길을 잃는다.
            //
            //   그래서 **안쪽으로만 연다.** 확대는 되고 축소는 첫 화면까지,
            //   이동은 첫 화면이 담은 범위 안에서. 학군을 벗어날 수 없으니
            //   '되돌아오는 버튼' 이 없어도 길을 잃지 않는다.
            //
            //   울타리 값(minZoom·maxBounds)은 여기서 정하지 못한다 —
            //   fitBounds 가 끝나야 그 학군의 배율과 범위를 알 수 있다.
            //   아래 idle 에서 잠근다.
            draggable: true,
            pinchZoom: true,
            scrollWheel: true,
            keyboardShortcuts: false,
            zoomControl: true,
            zoomControlOptions: { position: naver.maps.Position.TOP_RIGHT }
          });
          instances[id] = map;

          // 자동화 브라우저에서 지도가 비어 보이던 문제.
          //
          // 브라우저는 숨겨진 탭에서 requestAnimationFrame 을 돌리지 않는다.
          // 네이버 지도의 타일 렌더링이 바로 그 위에 얹혀 있어서, 백그라운드
          // 탭에서 페이지를 열면 지도 객체·크기·경계는 다 맞는데 타일만
          // 비어 있는 상태가 된다. 사용자가 그 탭으로 넘어와도 지도는
          // 스스로 다시 그리지 않는다.
          //
          // 그래서 다시 보이는 순간 resize 를 한 번 흘려 준다.
          var wake = function () {
            if (document.visibilityState !== 'visible') return;
            naver.maps.Event.trigger(map, 'resize');
          };
          document.addEventListener('visibilitychange', wake);
          map.__wake = wake;

          // 스크롤·필터로 위치가 바뀌면 지도가 제 크기를 다시 재야 한다.
          // getBoundingClientRect 한 번이라 비용은 무시할 수준이고,
          // 값이 그대로면 아무것도 하지 않는다.
          var lastBox = '';
          map.__watch = setInterval(function () {
            var r = el.getBoundingClientRect();
            if (r.width === 0) return;
            var box = [r.left, r.top, r.width, r.height].map(Math.round).join(',');
            if (box === lastBox) return;
            lastBox = box;
            naver.maps.Event.trigger(map, 'resize');
            // 크기가 바뀌면 울타리 값도 달라진다. 좁아진 화면에서 옛
            // minZoom 을 그대로 두면 학군이 화면에 다 안 들어오는데
            // 더 줄일 수도 없어 갇힌다. 풀고 다시 맞춘 뒤 다시 잠근다.
            if (map.__fit) {
              map.__relock = true;
              map.setOptions({ minZoom: 6, maxBounds: null });
              map.fitBounds(map.__fit,
                { top: 48, right: 40, bottom: 48, left: 40 });
            }
          }, 250);
        } else {
          map.setCenter(new naver.maps.LatLng(lat, lng));
          map.setZoom(zoom);
        }
        (map.__markers || []).forEach(function (m) { m.setMap(null); });
        map.__markers = [];

        var info = new naver.maps.InfoWindow({
          borderWidth: 0, backgroundColor: 'transparent',
          disableAnchor: true, pixelOffset: new naver.maps.Point(0, -8)
        });

        (map.__polys || []).forEach(function (p) { p.setMap(null); });
        map.__polys = [];

        var parsed = {};
        try { parsed = JSON.parse(payload || '{}'); } catch (e) { return true; }
        var items = parsed.markers || parsed || [];
        var zones = parsed.zones || [];

        // 학구 경계. 마커보다 아래에 깔린다.
        zones.forEach(function (z) {
          (z.rings || []).forEach(function (ring) {
            var path = ring.map(function (c) {
              return new naver.maps.LatLng(c[1], c[0]);
            });
            var poly = new naver.maps.Polygon({
              map: map, paths: [path],
              // 채우지 않는다.
              //
              // 옅게(0.05) 깔아도 학교군 폴리곤은 화면 전체를 덮을 만큼 커서,
              // 여러 겹이 쌓이면 지도가 하얗게 지워진다. SVG 를 숨겨 보고
              // 확인했다 — 숨기는 즉시 지도가 멀쩡히 나왔다.
              // 필요한 정보는 '경계가 어디인가' 이고 그건 선으로 충분하다.
              fillColor: z.color || '#182448', fillOpacity: 0,
              strokeColor: z.color || '#182448', strokeOpacity: 0.9,
              strokeWeight: 3, strokeStyle: 'shortdash', zIndex: 0,
              clickable: true
            });
            naver.maps.Event.addListener(poly, 'click', function (e) {
              info.setContent(
                '<div class="nm-info">' +
                '<div class="nm-title">' + z.name + '</div>' +
                '<div class="nm-body">' + (z.subtitle || '') + '</div>' +
                '</div>');
              info.setPosition(e.coord); info.open(map);
            });
            map.__polys.push(poly);
          });
        });

        items.forEach(function (it) {
          var marker = new naver.maps.Marker({
            position: new naver.maps.LatLng(it.lat, it.lng),
            map: map,
            zIndex: it.z || 1,
            icon: labelIcon(it)
          });
          // 접기 판정에 쓸 값. 아이콘을 갈아 끼워야 해서 원본을 들고 간다.
          marker.__it = it;
          naver.maps.Event.addListener(marker, 'click', function () {
            info.setContent(
              '<div class="nm-info">' +
              '<div class="nm-title">' + it.title + '</div>' +
              '<div class="nm-body">' + (it.subtitle || '') + '</div>' +
              '</div>');
            info.open(map, marker);
          });
          map.__markers.push(marker);
        });

        // ★ 고른 학군에 **맞춰** 잡는다. 중심·배율을 숫자로 받아 두면
        //   학군마다 퍼진 정도가 달라 어떤 곳은 넘치고 어떤 곳은 텅 빈다.
        //   그릴 것을 다 그린 뒤 그 경계에 맞추면 늘 꽉 찬다.
        //
        //   경계(zones)까지 넣으면 학교군 폴리곤이 화면 밖까지 뻗어 있어
        //   지도가 한없이 멀어진다 — **마커만** 기준으로 잡는다.
        // ★ 리스너를 **먼저** 단다.
        //
        //   처음에는 fitBounds 뒤에 달았는데, 그 사이에 idle 이 지나가
        //   버려 울타리가 영영 안 잠겼다(실측: relock 이 계속 true).
        //   맞추기 전에 달아 두면 놓칠 일이 없다.
        if (map.__idle) naver.maps.Event.removeListener(map.__idle);
        map.__idle = naver.maps.Event.addListener(map, 'idle', function () {
          lock(map);
          declutter(map);
        });

        var pts = items.map(function (it) {
          return new naver.maps.LatLng(it.lat, it.lng);
        });
        if (pts.length >= 2) {
          var b = new naver.maps.LatLngBounds(pts[0], pts[0]);
          pts.forEach(function (p) { b.extend(p); });
          // 창 크기가 바뀌면 다시 맞춰야 한다.
          map.__fit = b;
          // 울타리를 다시 잡아야 한다는 표시. 학군을 바꾸면 범위가 달라진다.
          map.__relock = true;
          // 먼저 풀어 준다. 지난 학군의 울타리가 남아 있으면 새 학군이
          // 그 안에 안 들어가 fitBounds 가 엉뚱한 곳에 선다.
          map.setOptions({ minZoom: 6, maxBounds: null });
          map.fitBounds(b, { top: 48, right: 40, bottom: 48, left: 40 });
        } else if (pts.length === 1) {
          map.__fit = null;
          map.__relock = false;
          map.setOptions({ minZoom: 6, maxBounds: null });
          map.setCenter(pts[0]);
          map.setZoom(zoom);
        }

        // idle 이 안 오는 경우를 대비한다. 이벤트 하나에 기대면 그 하나가
        // 안 왔을 때 울타리가 통째로 없는 지도가 나간다.
        setTimeout(function () { lock(map); declutter(map); }, 400);
        declutter(map);
        return true;
      }
      // 진단용. 콘솔에서 지도 상태를 확인할 때 쓴다.
      function get(id) { return instances[id]; }
      return { init: init, ready: ready, get: get };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
