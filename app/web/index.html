  <script>
    // Flutter 첫 프레임 이후 부팅 화면을 걷어낸다.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      setTimeout(function () { boot.remove(); }, 500);
    });
  </script>
  <script>
    // 예전 배포에서 등록된 서비스워커가 낡은 main.dart.js 를 붙잡고 있어,
    // 새로 배포해도 사용자는 바뀐 화면을 보지 못한다(로고를 키웠는데 그대로
    // 보이던 원인). 빌드에서 서비스워커를 끄는 것만으로는 부족하다 —
    // 이미 등록된 것은 브라우저에 남아 계속 캐시를 물고 있기 때문이다.
    // 그래서 매 로드마다 등록을 해제하고 캐시를 비운다.
    // 순위가 매일 갱신되는 서비스라 오프라인 캐시보다 최신성이 중요하다.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys()
        .then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); })
        .catch(function () {});
    }
  </script>
  <script>
    // 네이버 지도 키. 배포 워크플로가 시크릿 값으로 치환한다.
    // 치환되지 않았으면(로컬·키 미등록) 지도 SDK 를 아예 부르지 않고,
    // 앱은 좌표 없이도 동작하는 모식도 지도로 떨어진다.
    window.__NAVER_MAP_KEY_ID__ = '__NAVER_MAP_KEY_ID__';
    window.__NAVER_MAP_READY__ = false;
    (function () {
      var key = window.__NAVER_MAP_KEY_ID__;
      if (!key || key.indexOf('__') === 0) return;
      // 인증 실패 시 네이버가 이 함수를 부른다. 조용히 실패하지 않도록 잡아 둔다.
      window.navermap_authFailure = function () {
        window.__NAVER_MAP_READY__ = false;
        console.warn('네이버 지도 인증 실패 — 콘솔의 도메인 허용목록을 확인하세요.');
      };
      var s = document.createElement('script');
      s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' +
              encodeURIComponent(key);
      s.async = true;
      s.onload = function () { window.__NAVER_MAP_READY__ = true; };
      document.head.appendChild(s);
    })();
  </script>
  <script>
    // 네이버 지도 얇은 래퍼.
    // 지도 API 전체를 Dart 로 모델링하지 않고, 필요한 동작만 여기서 노출한다.
    // Flutter 쪽 인터롭 표면이 작을수록 SDK 가 바뀌어도 덜 깨진다.
    window.hakwonMap = (function () {
      var instances = {};
      function ready() { return !!(window.naver && window.naver.maps); }

      function init(id, lat, lng, zoom, payload) {
        if (!ready()) return false;
        var el = document.getElementById(id);
        if (!el) return false;
        var map = instances[id];
        if (!map) {
          map = new naver.maps.Map(el, {
            center: new naver.maps.LatLng(lat, lng),
            zoom: zoom,
            mapTypeControl: false,
            scaleControl: false,
            mapDataControl: false,
            zoomControl: true,
            zoomControlOptions: { position: naver.maps.Position.TOP_RIGHT }
          });
          instances[id] = map;
        } else {
          map.setCenter(new naver.maps.LatLng(lat, lng));
          map.setZoom(zoom);
        }
        (map.__markers || []).forEach(function (m) { m.setMap(null); });
        map.__markers = [];

        var info = new naver.maps.InfoWindow({
          borderWidth: 0, backgroundColor: 'transparent',
          disableAnchor: true, pixelOffset: new naver.maps.Point(0, -8)
        });

        var items = [];
        try { items = JSON.parse(payload || '[]'); } catch (e) { return true; }

        items.forEach(function (it) {
          var marker = new naver.maps.Marker({
            position: new naver.maps.LatLng(it.lat, it.lng),
            map: map,
            zIndex: it.z || 1,
            icon: {
              content:
                '<div style="transform:translate(-50%,-50%);white-space:nowrap;' +
                'font-family:Paperlogy,-apple-system,sans-serif;font-size:11.5px;' +
                'font-weight:700;letter-spacing:-.3px;color:#fff;padding:4px 9px;' +
                'border-radius:999px;background:' + it.color + ';' +
                'box-shadow:0 2px 8px rgba(0,0,0,.28);border:1.5px solid rgba(255,255,255,.85)">' +
                it.label + '</div>',
              anchor: new naver.maps.Point(0, 0)
            }
          });
          naver.maps.Event.addListener(marker, 'click', function () {
            info.setContent(
              '<div style="font-family:Paperlogy,-apple-system,sans-serif;' +
              'background:#fff;border-radius:12px;padding:12px 14px;min-width:190px;' +
              'box-shadow:0 8px 26px rgba(0,0,0,.20);border:1px solid #E2E7EA">' +
              '<div style="font-size:14px;font-weight:800;color:#0B1020">' + it.title + '</div>' +
              '<div style="font-size:11.5px;color:#5A6874;margin-top:3px">' + (it.subtitle || '') + '</div>' +
              '</div>');
            info.open(map, marker);
          });
          map.__markers.push(marker);
        });
        return true;
      }
      return { init: init, ready: ready };
    })();
  </script>
