  <style>

    /* CanvasKit 로딩 동안 흰 화면 대신 브랜드 화면을 보여준다.

<body>
  <div id="boot">
    <div class="mark"><img src="icons/Icon-512.png" alt="학원실록" width="138" height="138"></div>

  <script>
    // Flutter 첫 프레임 이후 부팅 화면을 걷어낸다.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      setTimeout(function () { boot.remove(); }, 500);
    });
  </script>
  <script>
    // 예전 배포에서 등록된 서비스워커가 낡은 main.dart.js 를 붙잡고 있어,
    // 새로 배포해도 사용자는 바뀐 화면을 보지 못한다(로고를 키웠는데 그대로
    // 보이던 원인). 빌드에서 서비스워커를 끄는 것만으로는 부족하다 —
    // 이미 등록된 것은 브라우저에 남아 계속 캐시를 물고 있기 때문이다.
    // 그래서 매 로드마다 등록을 해제하고 캐시를 비운다.
    // 순위가 매일 갱신되는 서비스라 오프라인 캐시보다 최신성이 중요하다.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys()
        .then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); })
        .catch(function () {});
    }
  </script>
  <script>
    // 네이버 지도 키. 배포 워크플로가 시크릿 값으로 치환한다.
    // 치환되지 않았으면(로컬·키 미등록) 지도 SDK 를 아예 부르지 않고,
    // 앱은 좌표 없이도 동작하는 모식도 지도로 떨어진다.
    window.__NAVER_MAP_KEY_ID__ = '__NAVER_MAP_KEY_ID__';
    window.__NAVER_MAP_READY__ = false;
    (function () {
      var key = window.__NAVER_MAP_KEY_ID__;
      if (!key || key.indexOf('__') === 0) return;
      // 인증 실패 시 네이버가 이 함수를 부른다. 조용히 실패하지 않도록 잡아 둔다.
      window.navermap_authFailure = function () {
        window.__NAVER_MAP_READY__ = false;
        console.warn('네이버 지도 인증 실패 — 콘솔의 도메인 허용목록을 확인하세요.');
      };
      var s = document.createElement('script');
      s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' +
              encodeURIComponent(key);
      s.async = true;
      s.onload = function () { window.__NAVER_MAP_READY__ = true; };
      document.head.appendChild(s);
    })();
  </script>
  <script>
    // 네이버 지도 얇은 래퍼.
    // 지도 API 전체를 Dart 로 모델링하지 않고, 필요한 동작만 여기서 노출한다.
    // Flutter 쪽 인터롭 표면이 작을수록 SDK 가 바뀌어도 덜 깨진다.
    window.hakwonMap = (function () {
      var instances = {};
      function ready() { return !!(window.naver && window.naver.maps); }

      function init(id, lat, lng, zoom, payload) {
        if (!ready()) return false;
        var el = document.getElementById(id);
        if (!el) return false;
        var map = instances[id];
        if (!map) {
          map = new naver.maps.Map(el, {
            center: new naver.maps.LatLng(lat, lng),
            zoom: zoom,
            mapTypeControl: false,
            scaleControl: false,
            mapDataControl: false,
            zoomControl: true,
            zoomControlOptions: { position: naver.maps.Position.TOP_RIGHT },
            // 4개 학군 서비스라 지도를 서울 밖으로 끌고 나갈 이유가 없다.
            // 범위를 묶어두면 길을 잃고 되돌아오지 못하는 일이 없다.
            maxBounds: new naver.maps.LatLngBounds(
              new naver.maps.LatLng(37.42, 126.76),   // 남서
              new naver.maps.LatLng(37.70, 127.18)    // 북동
            ),
            minZoom: 11,
            maxZoom: 18
          });
          instances[id] = map;

          // 첫 로드에서 지도가 비어 보이던 문제.
          //
          // 진짜 원인은 '칠하지 않음' 이었다. 타일은 정상적으로 내려받아지고
          // (45장) 위치도 맞는데, 브라우저가 그 영역을 다시 칠하지 않아
          // 화면에만 안 나왔다. 플러터 플랫폼 뷰가 만드는 합성 레이어 안에서
          // 벌어지는 일이라 지도 API 로는 손댈 수 없다.
          //
          // 여기까지 오는 데 네 번 헛짚었다. 타일 로딩 → 컨테이너 크기 →
          // 컨테이너 위치 → 폴리곤이 덮음. 전부 아니었다.
          // 결정적 단서: SVG 를 숨겼더니 지도가 나왔는데, 폴리곤을 그대로 둔
          // 채 opacity 만 건드려도 똑같이 나왔다. 숨김이 아니라 그로 인한
          // 리페인트가 원인이었던 것이다.
          //
          // 그래서 스타일을 아주 살짝 흔들어 리페인트를 강제한다.
          var repaint = function () {
            el.style.opacity = '0.999';
            void el.offsetHeight;          // 강제 리플로우
            el.style.opacity = '1';
          };

          naver.maps.Event.once(map, 'tilesloaded', repaint);

          // 초반 몇 번만으로는 부족했다. 배포 후 확인해 보니 80~1500ms 에
          // 호출해도 화면은 그대로였고, 몇 초 뒤 손으로 부르면 바로 나왔다.
          // 칠하지 않는 상태가 언제 시작되는지 정해져 있지 않다는 뜻이라,
          // 처음 8초 동안 반복해서 부른다. opacity 토글이라 비용은 거의 없다.
          var tries = 0;
          var boot = setInterval(function () {
            repaint();
            if (++tries >= 16) clearInterval(boot);
          }, 500);

          // 스크롤·필터로 위치가 바뀌면 같은 증상이 재발한다. 저빈도로 지켜본다.
          // getBoundingClientRect 한 번이라 비용은 무시할 수준이고,
          // 값이 그대로면 아무것도 하지 않는다.
          var lastBox = '';
          map.__watch = setInterval(function () {
            var r = el.getBoundingClientRect();
            if (r.width === 0) return;
            var box = [r.left, r.top, r.width, r.height].map(Math.round).join(',');
            if (box === lastBox) return;
            lastBox = box;
            naver.maps.Event.trigger(map, 'resize');
            repaint();
          }, 250);
        } else {
          map.setCenter(new naver.maps.LatLng(lat, lng));
          map.setZoom(zoom);
        }
        (map.__markers || []).forEach(function (m) { m.setMap(null); });
        map.__markers = [];

        var info = new naver.maps.InfoWindow({
          borderWidth: 0, backgroundColor: 'transparent',
          disableAnchor: true, pixelOffset: new naver.maps.Point(0, -8)
        });

        (map.__polys || []).forEach(function (p) { p.setMap(null); });
        map.__polys = [];

        var parsed = {};
        try { parsed = JSON.parse(payload || '{}'); } catch (e) { return true; }
        var items = parsed.markers || parsed || [];
        var zones = parsed.zones || [];

        // 학구 경계. 마커보다 아래에 깔린다.
        zones.forEach(function (z) {
          (z.rings || []).forEach(function (ring) {
            var path = ring.map(function (c) {
              return new naver.maps.LatLng(c[1], c[0]);
            });
            var poly = new naver.maps.Polygon({
              map: map, paths: [path],
              // 채우지 않는다.
              //
              // 옅게(0.05) 깔아도 학교군 폴리곤은 화면 전체를 덮을 만큼 커서,
              // 여러 겹이 쌓이면 지도가 하얗게 지워진다. SVG 를 숨겨 보고
              // 확인했다 — 숨기는 즉시 지도가 멀쩡히 나왔다.
              // 필요한 정보는 '경계가 어디인가' 이고 그건 선으로 충분하다.
              fillColor: z.color || '#182448', fillOpacity: 0,
              strokeColor: z.color || '#182448', strokeOpacity: 0.9,
              strokeWeight: 3, strokeStyle: 'shortdash', zIndex: 0,
              clickable: true
            });
            naver.maps.Event.addListener(poly, 'click', function (e) {
              info.setContent(
                '<div style="font-family:Paperlogy,-apple-system,sans-serif;' +
                'background:#fff;border-radius:12px;padding:12px 14px;min-width:190px;' +
                'box-shadow:0 8px 26px rgba(0,0,0,.20);border:1px solid #E2E7EA">' +
                '<div style="font-size:14px;font-weight:800;color:#0B1020">' + z.name + '</div>' +
                '<div style="font-size:11.5px;color:#5A6874;margin-top:3px">' + (z.subtitle || '') + '</div>' +
                '</div>');
              info.setPosition(e.coord); info.open(map);
            });
            map.__polys.push(poly);
          });
        });

        items.forEach(function (it) {
          var marker = new naver.maps.Marker({
            position: new naver.maps.LatLng(it.lat, it.lng),
            map: map,
            zIndex: it.z || 1,
            icon: {
              content:
                '<div style="transform:translate(-50%,-50%);white-space:nowrap;' +
                'font-family:Paperlogy,-apple-system,sans-serif;font-size:11.5px;' +
                'font-weight:700;letter-spacing:-.3px;color:#fff;padding:4px 9px;' +
                'border-radius:999px;background:' + it.color + ';' +
                'box-shadow:0 2px 8px rgba(0,0,0,.28);border:1.5px solid rgba(255,255,255,.85)">' +
                it.label + '</div>',
              anchor: new naver.maps.Point(0, 0)
            }
          });
          naver.maps.Event.addListener(marker, 'click', function () {
            info.setContent(
              '<div style="font-family:Paperlogy,-apple-system,sans-serif;' +
              'background:#fff;border-radius:12px;padding:12px 14px;min-width:190px;' +
              'box-shadow:0 8px 26px rgba(0,0,0,.20);border:1px solid #E2E7EA">' +
              '<div style="font-size:14px;font-weight:800;color:#0B1020">' + it.title + '</div>' +
              '<div style="font-size:11.5px;color:#5A6874;margin-top:3px">' + (it.subtitle || '') + '</div>' +
              '</div>');
            info.open(map, marker);
          });
          map.__markers.push(marker);
        });
        return true;
      }
      // 진단용. 콘솔에서 지도 상태를 확인할 때 쓴다.
      function get(id) { return instances[id]; }
      return { init: init, ready: ready, get: get };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
