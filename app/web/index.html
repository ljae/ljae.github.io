  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #F7F4EE; }
    @media (prefers-color-scheme: dark) { html, body { background: #0B1020; } }

    /* CanvasKit 로딩 동안 흰 화면 대신 브랜드 화면을 보여준다.
       Flutter 첫 프레임이 그려지면 스스로 사라진다. */
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(140deg, #1B2C55, #182448 55%, #0B1020);
      color: #fff; z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      transition: opacity .45s ease; 
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot .mark {
      width: 60px; height: 60px; border-radius: 15px; overflow: hidden;
      background: transparent;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 34px rgba(0,0,0,.45);
    }
    #boot .mark svg { width: 24px; height: 24px; fill: #fff; }
    #boot .name { font-size: 20px; font-weight: 800; letter-spacing: -.5px; }
    #boot .tag { font-size: 12.5px; color: rgba(255,255,255,.62); letter-spacing: -.2px; }
    #boot .bar {
      width: 132px; height: 3px; border-radius: 2px; overflow: hidden;
      background: rgba(255,255,255,.16);
    }
    #boot .bar i {
      display: block; width: 40%; height: 100%; border-radius: 2px;
      background: #B08D57; animation: slide 1.15s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark"><img src="icons/Icon-192.png" alt="학원실록" width="60" height="60"></div>
    <div class="name">학원실록</div>
    <div class="tag">대치 · 목동 · 반포 · 잠실 학원 테크트리</div>
    <div class="bar"><i></i></div>
  </div>

  <script>
    // Flutter 첫 프레임 이후 부팅 화면을 걷어낸다.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      setTimeout(function () { boot.remove(); }, 500);
    });
  </script>
