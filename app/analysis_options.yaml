# 정적 분석 설정.
#
# CI 가 `flutter analyze` 로 배포를 막는다. info 수준도 실패로 친다 —
# 한 번 쌓이기 시작하면 아무도 안 보게 되기 때문이다.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # 암묵적 dynamic 을 막는다. 정적 JSON 을 다루는 코드라
    # 캐스팅이 조용히 넘어가면 런타임에서야 터진다.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # 쓰지 않는 코드는 지운다. 남겨 두면 다음 사람이 이유를 찾느라 시간을 쓴다.
    unused_element: warning
    unused_field: warning
    unused_import: warning

linter:
  rules:
    - avoid_print                    # 로깅은 dart:developer 로
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures              # 던져 놓고 잊는 비동기 방지
    - use_build_context_synchronously # await 뒤 context 사용
    - always_declare_return_types
    - always_use_package_imports: false
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box
