name: Deploy to GitHub Pages

# openedu4u.com 배포.
#   /            → Flutter 웹 빌드 (에듀트리)
#   /openedu/    → 기존 Open Edu 정적 사이트 (그대로 보존)
#
# ★ 최초 1회 설정 필요: 저장소 Settings → Pages → Source 를
#   "Deploy from a branch" 에서 "GitHub Actions" 로 바꿔야 합니다.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

  # 야간 수집이 끝나면 이어서 배포한다.
  #
  # ★ 수집이 미는 데이터 커밋은 push 트리거를 깨우지 못한다. 봇이 기본
  #   GITHUB_TOKEN 으로 커밋하는데, 그 토큰이 만든 푸시는 다른 워크플로를
  #   실행하지 않는다(깃허브의 재귀 방지). 실측: 2026-08-29 데이터 커밋
  #   두 건(511befba·b44721bd)에 배포가 한 번도 안 붙었고, 사이트는 사람이
  #   무언가 밀 때까지 옛 번들을 내주고 있었다. 순위가 매일 갱신되는
  #   서비스에서 이건 조용한 고장이다.
  #
  #   workflow_run 은 깃허브가 직접 거는 연쇄라 그 제약을 받지 않는다.
  #   (이 트리거는 파일이 기본 브랜치에 있어야 동작한다)
  workflow_run:
    workflows: ["Nightly data collection"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 수집이 실패한 회차는 배포하지 않는다. workflow_run 은 성공·실패를
    # 가리지 않고 발화하므로 여기서 걸러야 한다 — 실패한 수집을 그대로
    # 내보내면 배포가 안 되는 것보다 나쁘다.
    # (build 가 걸러지면 needs 로 매달린 deploy 도 함께 건너뛴다)
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ★ workflow_run 의 기본 체크아웃은 **수집을 시작한 시점의 커밋**을
          #   집을 수 있다. 그러면 새 데이터를 만들어 놓고 옛 번들을 배포한다 —
          #   화면에는 성공으로 보이는데 내용만 안 바뀌는, 가장 알아채기 어려운
          #   실패다. 연쇄로 들어올 때는 main 최신을 명시적으로 집는다.
          #   (직접 실행은 고른 ref 를 그대로 존중한다)
          ref: >-
            ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: 의존성 설치
        working-directory: app
        run: flutter pub get

      - name: 정적 분석 · 테스트
        working-directory: app
        run: |
          flutter analyze
          flutter test --dart-define=PARENT_OPENING_ENABLED=true \
            --dart-define=PARENT_COMPARE_ENABLED=true --dart-define=PARENT_VOICE_ENABLED=true

      - name: 웹 빌드
        # --pwa-strategy=none : 서비스워커를 만들지 않는다.
        # 기본 설정은 예전 main.dart.js 를 캐시에 붙잡고 있어서, 새로 배포해도
        # 사용자는 한참 뒤에야(혹은 강력 새로고침을 해야) 바뀐 화면을 본다.
        # 순위가 매일 갱신되는 서비스라 오프라인 캐시보다 최신성이 중요하다.
        working-directory: app
        env:
          NAVER_MAP_KEY_ID: ${{ secrets.NAVER_MAP_KEY_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # 지도 SDK 키는 HTML 에 들어가야 해서 dart-define 으로는 닿지 않는다.
          if [ -n "$NAVER_MAP_KEY_ID" ]; then
            sed -i "s|__NAVER_MAP_KEY_ID__'|$NAVER_MAP_KEY_ID'|" web/index.html
            echo "네이버 지도 키 주입됨"
          else
            echo "네이버 지도 키 없음 — 모식도 지도로 동작"
          fi
          flutter build web --release --base-href / --pwa-strategy=none --no-wasm-dry-run \
            --dart-define=PARENT_OPENING_ENABLED=true \
            --dart-define=PARENT_COMPARE_ENABLED=true \
            --dart-define=PARENT_VOICE_ENABLED=true \
            --dart-define=NAVER_MAP_KEY_ID="$NAVER_MAP_KEY_ID" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 검색 페이지·분석 계약 회귀 검증
        run: |
          python -m pip install pytest requests
          python -m pytest -q pipeline/tests/test_growth.py pipeline/tests/test_growth_gsc.py pipeline/tests/test_search_pages.py pipeline/tests/test_parent_contact.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 학부모 의견 DB·HTTP 권한 회귀 검증
        run: |
          npm install --prefix pipeline/.cache/parent-voice-check --no-audit --no-fund @electric-sql/pglite@0.5.10 tsx@4.23.15
          PGLITE_MODULE="file://$PWD/pipeline/.cache/parent-voice-check/node_modules/@electric-sql/pglite/dist/index.js" \
            node --import "$PWD/pipeline/.cache/parent-voice-check/node_modules/tsx/dist/loader.mjs" pipeline/tests/parent_voice_sql_test.mjs

      - name: 이전 성공 배포의 페이지 변경 원장 복원
        uses: actions/cache/restore@v4
        with:
          path: pipeline/.cache/growth/page-manifest.json
          key: search-pages-manifest-v1-${{ github.run_id }}
          restore-keys: search-pages-manifest-v1-

      - name: 캐시 누락 시 성공 배포 artifact 복원
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import io, json, os, pathlib, urllib.request, zipfile
          target = pathlib.Path('pipeline/.cache/growth/page-manifest.json')
          if target.exists():
              raise SystemExit(0)
          base = 'https://api.github.com/repos/' + os.environ['GH_REPO']
          def get(path, binary=False):
              req = urllib.request.Request(base + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()
              return data if binary else json.loads(data)
          artifacts = get('/actions/artifacts?name=search-pages-manifest&per_page=100')['artifacts']
          for artifact in artifacts:
              if artifact['expired']:
                  continue
              run = get('/actions/runs/' + str(artifact['workflow_run']['id']))
              if run['conclusion'] != 'success' or run['head_branch'] != 'main':
                  continue
              with zipfile.ZipFile(io.BytesIO(get('/actions/artifacts/' + str(artifact['id']) + '/zip', True))) as archive:
                  payload = archive.read('page-manifest.json')
              json.loads(payload)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
              print('직전 성공 배포 artifact에서 원장 복원')
              break
          else:
              if artifacts:
                  raise SystemExit('성공 배포 원장을 복원할 수 없습니다. lifecycle 검토 후 명시적으로 복구하세요.')
              print('::warning::페이지 변경 원장 최초 bootstrap: 이전 artifact가 없습니다.')
          PY

      - name: 배포 산출물 조립
        run: |
          mkdir -p _site
          cp -r app/build/web/. _site/
          # 기존 Open Edu 사이트를 하위 경로로 보존
          mkdir -p _site/openedu
          cp -r openedu/. _site/openedu/
          # 커스텀 도메인
          cp CNAME _site/CNAME
          # 검색엔진·AI가 읽을 정적 페이지.
          # 앱은 CanvasKit 으로 캔버스에 그려서 크롤러가 내용을 하나도 못 읽는다.
          # 학원·학교·학군·트랙을 정적 HTML 로 따로 내보내 색인 대상을 만든다.
          # 저장소에는 커밋하지 않는다 — 4천 개 파일을 git 에 넣을 이유가 없다.
          python3 pipeline/seo.py _site
          echo "--- 배포 트리 ---"
          ls -la _site | head -20

      - name: 비공개 페이지 변경 원장 보관
        uses: actions/upload-artifact@v4
        with:
          name: search-pages-manifest
          path: pipeline/.cache/growth/page-manifest.json
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/download-artifact@v4
        with:
          name: search-pages-manifest
          path: pipeline/.cache/growth
      - name: 성공한 배포의 변경 원장 저장
        uses: actions/cache/save@v4
        with:
          path: pipeline/.cache/growth/page-manifest.json
          key: search-pages-manifest-v1-${{ github.run_id }}
