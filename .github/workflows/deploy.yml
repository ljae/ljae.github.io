name: Deploy to GitHub Pages

# openedu4u.com 배포.
#   /            → Flutter 웹 빌드 (에듀트리)
#   /openedu/    → 기존 Open Edu 정적 사이트 (그대로 보존)
#
# ★ 최초 1회 설정 필요: 저장소 Settings → Pages → Source 를
#   "Deploy from a branch" 에서 "GitHub Actions" 로 바꿔야 합니다.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: 의존성 설치
        working-directory: app
        run: flutter pub get

      - name: 정적 분석 · 테스트
        working-directory: app
        run: |
          flutter analyze
          flutter test

      - name: 웹 빌드
        # --pwa-strategy=none : 서비스워커를 만들지 않는다.
        # 기본 설정은 예전 main.dart.js 를 캐시에 붙잡고 있어서, 새로 배포해도
        # 사용자는 한참 뒤에야(혹은 강력 새로고침을 해야) 바뀐 화면을 본다.
        # 순위가 매일 갱신되는 서비스라 오프라인 캐시보다 최신성이 중요하다.
        working-directory: app
        env:
          NAVER_MAP_KEY_ID: ${{ secrets.NAVER_MAP_KEY_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # 지도 SDK 키는 HTML 에 들어가야 해서 dart-define 으로는 닿지 않는다.
          if [ -n "$NAVER_MAP_KEY_ID" ]; then
            sed -i "s|__NAVER_MAP_KEY_ID__'|$NAVER_MAP_KEY_ID'|" web/index.html
            echo "네이버 지도 키 주입됨"
          else
            echo "네이버 지도 키 없음 — 모식도 지도로 동작"
          fi
          flutter build web --release --base-href / --pwa-strategy=none \
            --dart-define=NAVER_MAP_KEY_ID="$NAVER_MAP_KEY_ID" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 배포 산출물 조립
        run: |
          mkdir -p _site
          cp -r app/build/web/. _site/
          # 기존 Open Edu 사이트를 하위 경로로 보존
          mkdir -p _site/openedu
          cp -r openedu/. _site/openedu/
          # 커스텀 도메인
          cp CNAME _site/CNAME
          # 검색엔진·AI가 읽을 정적 페이지.
          # 앱은 CanvasKit 으로 캔버스에 그려서 크롤러가 내용을 하나도 못 읽는다.
          # 학원·학교·학군·트랙을 정적 HTML 로 따로 내보내 색인 대상을 만든다.
          # 저장소에는 커밋하지 않는다 — 4천 개 파일을 git 에 넣을 이유가 없다.
          python3 pipeline/seo.py _site
          # SPA 라우팅: 알 수 없는 경로도 앱이 처리하도록
          cp _site/index.html _site/404.html
          echo "--- 배포 트리 ---"
          ls -la _site | head -20

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
