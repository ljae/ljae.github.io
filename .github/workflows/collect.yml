name: Nightly data collection

# 매일 새벽 NEIS·네이버에서 수집하고 점수를 다시 계산해 커밋한다.
# 카페 로컬 모듈은 여기서 절대 실행되지 않는다(모듈 자체가 CI를 거부한다).

on:
  schedule:
    - cron: '0 19 * * *'      # UTC 19:00 = KST 04:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r pipeline/requirements.txt

      # 수집 캐시를 실행 간에 유지한다.
      #  - blog_texts.json : 이미 받은 블로그 본문을 다시 받지 않는다
      #  - first_seen.json : 언급을 처음 본 시점. 화제성 계산의 시계다
      # 캐시가 없어지면 발견 시점 기록이 기준선부터 다시 시작한다.
      # (전부 '신규'로 오인하지 않고 조용히 기준선을 다시 잡는다)
      - uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: edutree-cache-${{ github.run_id }}
          restore-keys: |
            edutree-cache-

      - name: 수집 · 채점
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python pipeline/run.py

      - name: Supabase 업로드 (키가 있을 때만)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            python pipeline/sync_supabase.py
          else
            echo "Supabase 키 없음 — 건너뜀"
          fi

      - name: 변경분 커밋
        run: |
          git config user.name  "edutree-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/assets/data
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 학원 데이터 및 트리스코어 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
