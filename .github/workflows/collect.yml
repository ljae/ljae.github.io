name: Nightly data collection

# 매일 새벽 NEIS·네이버에서 수집하고 점수를 다시 계산해 커밋한다.
# 카페 로컬 모듈은 여기서 절대 실행되지 않는다(모듈 자체가 CI를 거부한다).

on:
  schedule:
    - cron: '0 19 * * *'      # UTC 19:00 = KST 04:00
  workflow_dispatch:
    inputs:
      rescore_only:
        description: '최신 운영 캐시만 재채점 (신규 수집 생략)'
        type: boolean
        default: false
      directory_only:
        description: '학원 소개 출처만 갱신 (검색·재채점 생략)'
        type: boolean
        default: false
      target_academies:
        description: '재채점 전 추가 수집할 등록번호 (쉼표 구분, 최대 20곳)'
        type: string
        default: ''
      refresh_neis:
        description: '캐시 재채점 전 교육청 전체 공시를 새로 조회 (학년 전수 점검)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r pipeline/requirements.txt

      - name: 랭킹 및 근거 회귀 검증
        run: python -m pytest pipeline/tests -q

      # 수집 캐시를 실행 간에 유지한다.
      #  - blog_texts.json : 이미 받은 블로그 본문을 다시 받지 않는다
      #  - first_seen.json : 언급을 처음 본 시점. 화제성 계산의 시계다
      # 캐시가 없어지면 발견 시점 기록이 기준선부터 다시 시작한다.
      # (전부 '신규'로 오인하지 않고 조용히 기준선을 다시 잡는다)
      - uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: edutree-cache-${{ github.run_id }}
          restore-keys: |
            edutree-cache-

      - name: 수집 · 채점
        env:
          RESCORE_ONLY: ${{ inputs.rescore_only }}
          TARGET_ACADEMIES: ${{ inputs.target_academies }}
          REFRESH_NEIS: ${{ inputs.refresh_neis }}
          DIRECTORY_ONLY: ${{ inputs.directory_only }}
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          NAVER_MAP_CLIENT_SECRET: ${{ secrets.NAVER_MAP_CLIENT_SECRET }}
          # ★ 이 셋이 빠져 있어 **세 데이터 출처가 통째로 꺼져** 있었다.
          #   시크릿은 2026-08-26 에 등록돼 있었는데 job 에 안 넘겼다.
          #   야간 로그가 그대로 말하고 있었다:
          #     학교알리미     ✗ 키 없음
          #     학구도(통학구역) 키 없음
          #     공동주택(아파트)  키 없음
          #   실측: 라이브 schools.json 140곳 전부 zoneId 가 null 이라
          #   중·고 학교군 배정이 데이터 없이 돌고 있었다.
          #
          #   키가 없어도 파이프라인은 캐시로 계속 가도록 짜여 있다(그래서
          #   **성공으로 끝나고 아무도 못 알아챈다**). 조용한 고장이다.
          DATA_GO_KR_KEY_ENCODED: ${{ secrets.DATA_GO_KR_KEY_ENCODED }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SCHOOLINFO_API_KEY: ${{ secrets.SCHOOLINFO_API_KEY }}
          # 글 요약(wiki/posts 의 auto:summary). 시크릿이 없으면 요약만
          # 건너뛰고 수집·채점은 그대로 돈다. 점수에는 쓰이지 않는다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENEDU_SUMMARY_PROVIDER: ${{ vars.OPENEDU_SUMMARY_PROVIDER }}
          OPENEDU_SUMMARY_MODEL: ${{ vars.OPENEDU_SUMMARY_MODEL }}
          OPENEDU_SUMMARY_PER_RUN: ${{ vars.OPENEDU_SUMMARY_PER_RUN }}
          OPENEDU_SUMMARY_WORKERS: ${{ vars.OPENEDU_SUMMARY_WORKERS }}
        run: |
          if [ "$DIRECTORY_ONLY" = "true" ]; then
            python - <<'PY'
          import json
          from pipeline.edutree import config, directory
          academies = []
          for name in ('academies.json', 'registry.json'):
              academies.extend(json.loads((config.EXPORT_DIR / name).read_text()))
          directory.collect(academies, [], live=True)
          notes = directory.source_notes(academies)
          # source_notes가 통신 실패의 이전 자료를 개별 보존한다.
          # 전부 폐쇄/불일치로 확인된 경우 빈 결과도 반영해야 한다.
          (config.EXPORT_DIR / 'directory_sources.json').write_text(json.dumps(notes, ensure_ascii=False, indent=2))
          PY
          elif [ "$RESCORE_ONLY" = "true" ]; then
            # 캐시가 없으면 오래된 대체 자료나 합성 데이터로 게시하지 않는다.
            python - <<'PY'
          import json
          from pipeline.edutree import config, mention_store
          assert json.loads((config.CACHE_DIR / "neis_academies.json").read_text()), "NEIS 캐시 없음"
          assert mention_store.rows(), "누적 언급 캐시 없음"
          import os
          if os.environ.get('REFRESH_NEIS') == 'true':
              from pipeline.edutree import neis
              neis.fetch_all()
          if os.environ.get('TARGET_ACADEMIES', '').strip():
              from pipeline.edutree.targeted import collect
              collect(os.environ['TARGET_ACADEMIES'])
          PY
            OPENEDU_CLAIM_LLM_LIMIT=0 OPENEDU_SUMMARY_PER_RUN=0 python pipeline/run.py --from-cache
          else
            python pipeline/run.py
          fi

      - name: 출처 접근 상태와 제외 사유 기록
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = ['## 출처 접근 상태']
          access = Path('pipeline/.cache/directory_access.json')
          if access.exists():
              for host, row in json.loads(access.read_text()).items():
                  lines.append(f"- 학원 소개 직접 갱신 {host}: HTTP {row['status']} · 마지막 시도 {row['attempted_at']} (성공 확인일과 별도)")
          path = Path('pipeline/.cache/source_health.json')
          if path.exists():
              for source, row in json.loads(path.read_text()).items():
                  lines.append(f"- {source}: {row['status']} · 결과 {row['results']}건 · 오류 {row['errors']}회 · 확인 {row['checkedAt']}")
          else:
              lines.append('- 확인 기록 없음 (수집 성공으로 간주하지 않음)')
          path = Path('app/assets/data/meta.json')
          if path.exists():
              report = json.loads(path.read_text()).get('rankingQuality', {})
              lines += ['## 후기 제외 사유', json.dumps(report.get('exclusionReasons', {}), ensure_ascii=False)]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(lines) + '\n')
          PY

      - name: Supabase 업로드 (키가 있을 때만)
        if: ${{ !inputs.directory_only }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            python pipeline/sync_supabase.py
          else
            echo "Supabase 키 없음 — 건너뜀"
          fi

      # 진로 공시는 학교알리미가 연속 호출을 막는다. 6초 간격이라
      # 157곳이면 16분. 야간 작업에 얹어 두고 캐시로 이어받는다.
      - name: 진로 공시 수집 (이어받기)
        if: ${{ !inputs.rescore_only && !inputs.directory_only }}
        continue-on-error: true
        env:
          SCHOOLINFO_API_KEY: ${{ secrets.SCHOOLINFO_API_KEY }}
        run: python pipeline/run.py --careers

      # 정정 요청이 쌓여 있으면 이 단계를 실패시켜 깃허브 알림이 가게 한다.
      # 로그에만 찍으면 아무도 안 본다 — 놓치면 창구가 없는 것과 같다.
      # 다른 단계는 이미 끝난 뒤라 데이터 갱신에는 영향이 없다.
      - name: 미처리 정정 요청 확인
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            python pipeline/corrections_report.py --fail-on-open
          fi

      # 신고를 사례 파일로 옮긴다(pipeline/wiki/cases). 파일은 pipeline/wiki 와
      # 함께 커밋되므로 다음 날 사람이 Claude Code 에서 /triage-reports 를
      # 열면 접수가 이미 대장에 있다. 여기서는 판단하지 않는다 — 옮기고 센다.
      - name: 신고 → 사례 대장
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            python pipeline/run.py --cases
          fi

      - name: 변경분 커밋
        run: |
          git config user.name  "edutree-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/assets/data pipeline/wiki
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 학원 데이터 및 트리스코어 갱신 ($(date -u +%Y-%m-%d))"
            # ★ 30분 넘게 도는 작업이라 그동안 main 이 움직여 있을 수 있다.
            #   그대로 push 하면 'fetch first' 로 거부되고 **한 회차가 통째로
            #   버려진다**(실측: 수집·채점·요약을 다 끝낸 뒤 마지막 줄에서
            #   실패). 생성물끼리는 우리 것이 최신이므로 우리 것을 쓴다.
            for i in 1 2 3; do
              git push && exit 0
              echo "push 거부됨 — 원격을 받아 다시 얹는다 (시도 $i)"
              git fetch origin main
              git rebase -X ours origin/main || {
                echo "리베이스 실패 — 생성물만 다시 얹는다"
                git rebase --abort || true
                git reset --soft origin/main
                git add app/assets/data pipeline/wiki
                git commit -m "data: 학원 데이터 및 트리스코어 갱신 ($(date -u +%Y-%m-%d))"
              }
            done
            echo "::error::세 번 시도했으나 push 실패"
            exit 1
          fi
