name: Nightly data collection

# 매일 밤 NEIS·네이버·다음에서 수집하고 점수를 다시 계산해 커밋한다.
# 카페 로컬 모듈은 여기서 절대 실행되지 않는다(모듈 자체가 CI를 거부한다).

on:
  schedule:
    # 깃허브는 예약 실행을 3.5~7시간 늦게 시작한다(실측 11-06~11-14: 19:00 UTC
    # 예약이 22:27~01:50 UTC 에 시작). 아침 알림(07:30 KST)이 지난밤 결과를
    # 읽으려면 그 전에 배포까지 끝나야 하므로 앞당긴다. 정각은 가장 붐빈다.
    - cron: '23 13 * * *'     # UTC 13:23 = KST 22:23; 시작·완료 시각은 지연될 수 있음
  workflow_dispatch:
    inputs:
      publish_data:
        description: '검증 결과 게시 (해제하면 artifact 검토만, 랭킹·미러 변경 없음)'
        type: boolean
        default: true
      rescore_only:
        description: '최신 운영 캐시만 재채점 (신규 수집 생략)'
        type: boolean
        default: false
      directory_only:
        description: '학원 소개 출처만 갱신 (검색·재채점 생략)'
        type: boolean
        default: false
      target_academies:
        description: '재채점 전 추가 수집할 등록번호 (쉼표 구분, 최대 20곳)'
        type: string
        default: ''
      refresh_neis:
        description: '캐시 재채점 전 교육청 전체 공시를 새로 조회 (학년 전수 점검)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Built-in pip-cache hashing overflowed the JS stack after Python setup
          # on the 125k-file repository (run 42531171510). Install directly;
          # retain the separate, essential source-data cache below.

      - run: pip install -r pipeline/requirements.txt

      - name: 랭킹 및 근거 회귀 검증
        run: PYTHONPATH=pipeline python -m pytest pipeline/tests -q

      - name: 대상학년 필터 데이터 감사
        run: PYTHONPATH=pipeline python -m pipeline.edutree.grade_audit --asset-dir app/assets/data

      # 수집 캐시를 실행 간에 유지한다.
      #  - blog_texts.json : 이미 받은 블로그 본문을 다시 받지 않는다
      #  - first_seen.json : 언급을 처음 본 시점. 화제성 계산의 시계다
      # 캐시가 없어지면 발견 시점 기록이 기준선부터 다시 시작한다.
      # (전부 '신규'로 오인하지 않고 조용히 기준선을 다시 잡는다)
      - uses: actions/cache/restore@v4
        with:
          path: pipeline/.cache
          key: edutree-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            edutree-cache-

      - name: Verify evidence continuity and restore encrypted checkpoint
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          OPENEDU_EVIDENCE_BACKUP_KEY: ${{ secrets.OPENEDU_EVIDENCE_BACKUP_KEY }}
        run: python -m pipeline.edutree.evidence_backup restore

      - name: 수집 · 채점
        id: collect_data
        env:
          PYTHONUNBUFFERED: '1'
          OPENEDU_BLOG_PER_RUN: '300'
          OPENEDU_BLOG_BUDGET_SECONDS: '600'
          RESCORE_ONLY: ${{ inputs.rescore_only }}
          TARGET_ACADEMIES: ${{ inputs.target_academies }}
          REFRESH_NEIS: ${{ inputs.refresh_neis }}
          DIRECTORY_ONLY: ${{ inputs.directory_only }}
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # 전체 야간 수집에서는 네이버·다음 키를 모두 요구한다.
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          NAVER_MAP_CLIENT_SECRET: ${{ secrets.NAVER_MAP_CLIENT_SECRET }}
          # ★ 이 셋이 빠져 있어 **세 데이터 출처가 통째로 꺼져** 있었다.
          #   시크릿은 2026-08-26 에 등록돼 있었는데 job 에 안 넘겼다.
          #   야간 로그가 그대로 말하고 있었다:
          #     학교알리미     ✗ 키 없음
          #     학구도(통학구역) 키 없음
          #     공동주택(아파트)  키 없음
          #   실측: 라이브 schools.json 140곳 전부 zoneId 가 null 이라
          #   중·고 학교군 배정이 데이터 없이 돌고 있었다.
          #
          #   키가 없어도 파이프라인은 캐시로 계속 가도록 짜여 있다(그래서
          #   **성공으로 끝나고 아무도 못 알아챈다**). 조용한 고장이다.
          DATA_GO_KR_KEY_ENCODED: ${{ secrets.DATA_GO_KR_KEY_ENCODED }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SCHOOLINFO_API_KEY: ${{ secrets.SCHOOLINFO_API_KEY }}
          # 글 요약(wiki/posts 의 auto:summary). 시크릿이 없으면 요약만
          # 건너뛰고 수집·채점은 그대로 돈다. 점수에는 쓰이지 않는다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENEDU_SUMMARY_PROVIDER: ${{ vars.OPENEDU_SUMMARY_PROVIDER }}
          OPENEDU_SUMMARY_MODEL: ${{ vars.OPENEDU_SUMMARY_MODEL }}
          # Parent-service pilot: preserve cached summaries, with no new paid
          # model calls. Paid escalation requires a separate approved budget.
          OPENEDU_SUMMARY_PER_RUN: '0'
          OPENEDU_CLAIM_LLM_LIMIT: '0'
          OPENEDU_PROFILE_PER_RUN: '0'
          OPENEDU_SUMMARY_WORKERS: ${{ vars.OPENEDU_SUMMARY_WORKERS }}
        run: |
          if [ "$DIRECTORY_ONLY" = "true" ]; then
            python - <<'PY'
          import json
          from pipeline.edutree import config, directory
          academies = []
          for name in ('academies.json', 'registry.json'):
              academies.extend(json.loads((config.EXPORT_DIR / name).read_text()))
          directory.collect(academies, [], live=True)
          notes = directory.source_notes(academies)
          # source_notes가 통신 실패의 이전 자료를 개별 보존한다.
          # 전부 폐쇄/불일치로 확인된 경우 빈 결과도 반영해야 한다.
          (config.EXPORT_DIR / 'directory_sources.json').write_text(json.dumps(notes, ensure_ascii=False, indent=2))
          PY
          elif [ "$RESCORE_ONLY" = "true" ]; then
            # 캐시가 없으면 오래된 대체 자료나 합성 데이터로 게시하지 않는다.
            python - <<'PY'
          import json
          from pipeline.edutree import config, mention_store
          assert json.loads((config.CACHE_DIR / "neis_academies.json").read_text()), "NEIS 캐시 없음"
          assert mention_store.rows(), "누적 언급 캐시 없음"
          import os
          if os.environ.get('REFRESH_NEIS') == 'true':
              from pipeline.edutree import neis
              neis.fetch_all()
          if os.environ.get('TARGET_ACADEMIES', '').strip():
              from pipeline.edutree.targeted import collect
              collect(os.environ['TARGET_ACADEMIES'])
          PY
            OPENEDU_CLAIM_LLM_LIMIT=0 OPENEDU_SUMMARY_PER_RUN=0 python pipeline/run.py --from-cache
          else
            python -m pipeline.edutree.source_health start
            python pipeline/run.py
          fi

      - name: 생성된 대상학년 필터 데이터 감사
        if: ${{ !inputs.directory_only }}
        run: PYTHONPATH=pipeline python -m pipeline.edutree.grade_audit --asset-dir app/assets/data

      - name: Verify durable encrypted evidence checkpoint before publication
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          OPENEDU_EVIDENCE_BACKUP_KEY: ${{ secrets.OPENEDU_EVIDENCE_BACKUP_KEY }}
        run: python -m pipeline.edutree.evidence_backup checkpoint

      # actions/cache의 자동 post-save는 뒤 단계가 실패하면 실행되지 않는다.
      # 체크포인트/게시 실패에도 새로 수집한 근거를 다음 회차로 이어간다.
      - name: Preserve collected source cache even when publication is held
        if: ${{ !cancelled() && steps.collect_data.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: pipeline/.cache
          key: edutree-cache-${{ github.run_id }}-${{ github.run_attempt }}

      # 게시가 보류돼도 후보를 검토할 수 있게 남긴다. artifact는 게시 승인이 아니다.
      - name: 랭킹 후보 산출물 보관
        if: ${{ !cancelled() && steps.collect_data.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ranked-data
          path: |
            app/assets/data
            pipeline/data/ranking_agent_feedback.json
          retention-days: 7
          if-no-files-found: error

      - name: Verify this run refreshed Naver and Daum
        if: ${{ !cancelled() && steps.collect_data.outcome == 'success' && !inputs.rescore_only && !inputs.directory_only }}
        run: python -m pipeline.edutree.source_health check

      - name: Retain nightly source checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-source-health
          path: |
            pipeline/.cache/nightly-source-start.json
            pipeline/.cache/nightly-source-check.json
            pipeline/.cache/source_health.json
          if-no-files-found: ignore
          retention-days: 14

      - name: 미확인 학년 웹 검색 후보 수집
        if: ${{ !inputs.directory_only }}
        continue-on-error: true
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -m pipeline.edutree.grade_research --discover --limit 40

      - name: 학년 조사 대기열 보관
        uses: actions/upload-artifact@v4
        with:
          name: grade-research
          path: pipeline/.cache/grade_research.json
          if-no-files-found: ignore

      - name: 후기 에이전트 검증·학습 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-agent-state
          path: |
            pipeline/.cache/ranking_agents/memory.json
            pipeline/.cache/ranking_agents/last_cycle.json
            pipeline/.cache/ranking_agents/regression.json
            pipeline/.cache/ranking_agents/batch_imports.json
          if-no-files-found: ignore

      - name: 후기 에이전트 실행 요약
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('pipeline/.cache/ranking_agents/last_cycle.json')
          lines = ['## 후기 랭킹 에이전트']
          if path.exists():
              report = json.loads(path.read_text())
              lines += [f"- 마지막 검증 완료 {report['finalized']}회 · 대기 {report['pending']}회",
                        '- 검증 시각: ' + report.get('evaluated_at', '기록 없음'),
                        '- 누적 관측: ' + json.dumps(report.get('totals', {}), ensure_ascii=False),
                        '- 지표는 수집 효율이며 사실 정확도를 뜻하지 않습니다.']
          else:
              lines.append('- 이번 실행에서 완료한 브라우저 수집 검증 없음')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write('\n'.join(lines) + '\n')
          PY

      - name: 출처 접근 상태와 제외 사유 기록
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = ['## 출처 접근 상태']
          access = Path('pipeline/.cache/directory_access.json')
          if access.exists():
              for host, row in json.loads(access.read_text()).items():
                  lines.append(f"- 학원 소개 직접 갱신 {host}: HTTP {row['status']} · 마지막 시도 {row['attempted_at']} (성공 확인일과 별도)")
          path = Path('pipeline/.cache/source_health.json')
          if path.exists():
              for source, row in json.loads(path.read_text()).items():
                  lines.append(f"- {source}: {row['status']} · 결과 {row['results']}건 · 오류 {row['errors']}회 · 확인 {row['checkedAt']}")
          else:
              lines.append('- 확인 기록 없음 (수집 성공으로 간주하지 않음)')
          path = Path('app/assets/data/meta.json')
          if path.exists():
              report = json.loads(path.read_text()).get('rankingQuality', {})
              lines += ['## 후기 제외 사유', json.dumps(report.get('exclusionReasons', {}), ensure_ascii=False)]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(lines) + '\n')
          PY

      - name: Check source freshness before public data writes
        # 검토용 실행에서도 같은 게이트를 검사해 실제 게시 가능 여부를 남긴다.
        if: ${{ !inputs.directory_only }}
        run: python -m pipeline.edutree.parent_service_audit --output pipeline/.cache/parent-service-prepublish.json --compare-live --fail-unhealthy

      - name: Retain publication health decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-health
          path: pipeline/.cache/parent-service-prepublish.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Supabase 업로드 (키가 있을 때만)
        id: supabase_mirror
        if: ${{ !inputs.directory_only && (github.event_name != 'workflow_dispatch' || inputs.publish_data) }}
        # 앱의 랭킹은 정적 JSON을 읽는다. 부가 미러의 장애는 경고로 남기고
        # 검증된 랭킹의 커밋·배포는 계속한다. 미러 성공으로 기록하지 않는다.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            python pipeline/sync_supabase.py
          else
            echo "Supabase 키 없음 — 건너뜀"
          fi

      - name: Supabase 미러 상태 기록
        if: ${{ always() && steps.supabase_mirror.outcome == 'failure' }}
        run: |
          echo "::warning::Supabase 미러 동기화 실패 — 정적 랭킹 배포는 계속하며 미러는 다음 회차에 재시도합니다"
          echo '## 부가 서비스 장애' >> "$GITHUB_STEP_SUMMARY"
          echo '- Supabase 미러 동기화 실패. 정적 랭킹과 별도로 복구가 필요합니다.' >> "$GITHUB_STEP_SUMMARY"

      # 진로 공시는 학교알리미가 연속 호출을 막는다. 6초 간격이라
      # 157곳이면 16분. 야간 작업에 얹어 두고 캐시로 이어받는다.
      - name: 진로 공시 수집 (이어받기)
        if: ${{ !inputs.rescore_only && !inputs.directory_only }}
        continue-on-error: true
        env:
          SCHOOLINFO_API_KEY: ${{ secrets.SCHOOLINFO_API_KEY }}
        run: python pipeline/run.py --careers

      # 정정 요청이 쌓여 있으면 이 단계를 실패시켜 깃허브 알림이 가게 한다.
      # 로그에만 찍으면 아무도 안 본다 — 놓치면 창구가 없는 것과 같다.
      # 다른 단계는 이미 끝난 뒤라 데이터 갱신에는 영향이 없다.
      - name: 미처리 정정 요청 확인
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            python pipeline/corrections_report.py --fail-on-open
          fi

      # 신고를 사례 파일로 옮긴다(pipeline/wiki/cases). 파일은 pipeline/wiki 와
      # 함께 커밋되므로 다음 날 사람이 Claude Code 에서 /triage-reports 를
      # 열면 접수가 이미 대장에 있다. 여기서는 판단하지 않는다 — 옮기고 센다.
      - name: 신고 → 사례 대장
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            python pipeline/run.py --cases
          fi

      - name: 변경분 커밋
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_data }}
        run: |
          git config user.name  "edutree-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/assets/data pipeline/wiki
          if [ -f pipeline/data/ranking_agent_feedback.json ]; then
            git add pipeline/data/ranking_agent_feedback.json
          fi
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 학원 데이터 및 트리스코어 갱신 ($(date -u +%Y-%m-%d))"
            # ★ 한 시간 넘게 도는 작업이라 그동안 main 이 움직여 있을 수 있다.
            #   그대로 push 하면 'fetch first' 로 거부되고 **한 회차가 통째로
            #   버려진다**(실측: 수집·채점·요약을 다 끝낸 뒤 마지막 줄에서
            #   실패). 원격을 받아 우리 커밋을 그 위에 다시 얹는다.
            #
            #   ★ 리베이스에서 ours/theirs 는 병합과 **반대**다. ours 가 원격
            #     (얹히는 바탕), theirs 가 다시 얹는 우리 커밋이다. 예전에는
            #     -X ours 라 충돌한 자리에서 방금 만든 데이터가 버려졌다.
            #     겹치지 않는 사람 손길(위키 frontmatter)은 그대로 남는다.
            for i in 1 2 3; do
              git push && exit 0
              echo "push 거부됨 — 원격을 받아 다시 얹는다 (시도 $i)"
              ours=$(git rev-parse HEAD)
              git fetch origin main
              git rebase -X theirs origin/main || {
                # 예전 폴백은 reset --soft 였다. 인덱스에 **우리 회차의 옛 트리
                # 전체**가 남아, 그대로 커밋하면 그사이 main 에 들어온 코드를
                # 되돌린다. 원격 트리에서 시작해 생성 데이터만 가져온다.
                # 위키는 사람이 쓴 것이 섞여 있어 통째로 덮지 않는다 — auto
                # 블록은 다음 회차가 다시 적는다.
                echo "::warning::리베이스 실패 — 원격 최신 위에 생성 데이터만 얹는다(위키는 다음 회차)"
                git rebase --abort || true
                git reset --hard origin/main
                git restore --source="$ours" --staged --worktree -- app/assets/data
                if git cat-file -e "$ours:pipeline/data/ranking_agent_feedback.json" 2>/dev/null; then
                  git restore --source="$ours" --staged --worktree -- pipeline/data/ranking_agent_feedback.json
                fi
                if git diff --staged --quiet; then
                  echo "원격과 같은 데이터 — 밀 것이 없다"
                  exit 0
                fi
                git commit -m "data: 학원 데이터 및 트리스코어 갱신 ($(date -u +%Y-%m-%d))"
              }
            done
            echo "::error::세 번 시도했으나 push 실패"
            exit 1
          fi
