name: Search growth analysis

on:
  schedule:
    - cron: '30 0 * * *' # 09:30 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-growth
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pytest
      - name: 운영 연결 확인
        id: config
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os
          keys = ('GSC_CLIENT_ID','GSC_CLIENT_SECRET','GSC_REFRESH_TOKEN','SUPABASE_URL','SUPABASE_SERVICE_KEY')
          ready = all(os.environ.get(k) for k in keys)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'ready={str(ready).lower()}\n')
          if not ready:
              print('::notice::검색 수집 연결 대기: GSC 읽기 전용 인증과 Supabase 서버 키가 필요합니다.')
          PY
      - name: 데이터 계약 검증
        run: python -m pytest -q pipeline/tests/test_growth.py pipeline/tests/test_growth_gsc.py pipeline/tests/test_search_pages.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 분석 DB 권한·상태 전이 검증
        run: |
          npm install --prefix pipeline/.cache/growth/sqlcheck --no-audit --no-fund @electric-sql/pglite@0.5.10
          PGLITE_MODULE="file://$PWD/pipeline/.cache/growth/sqlcheck/node_modules/@electric-sql/pglite/dist/index.js" node pipeline/tests/growth_sql_test.mjs
      - name: 최근 완결 기간 수집 · 비공개 게시
        if: steps.config.outputs.ready == 'true'
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          from pipeline.growth.cli import main
          end = datetime.now(ZoneInfo('America/Los_Angeles')).date()-timedelta(days=3)
          start = end-timedelta(days=27)
          status = main(['sync-gsc','--start',str(start),'--end',str(end)])
          if status:
              raise SystemExit(status)
          raise SystemExit(main(['publish']))
          PY
